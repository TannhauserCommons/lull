[package]
name = "lull-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "lull desktop wrapper: hosts the web UI from your server, adds a tray and a mini player"
publish = false

# Its own workspace: the root workspace excludes desktop/, so Tauri's tree never slows the server build.
[workspace]

[[bin]]
name = "lull"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# The webview shell itself; tray-icon + image-png for the tray glyphs.
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
# Official plugins named in DESKTOP.md: window placement, one instance, launch at login.
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
# Settings file and IPC payloads.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Blocking HTTP for the connect test, the launch probe and the token hand-off (the webview can't read
# a cross-origin /health). Platform verifier: trust exactly what the webview trusts (home CAs included).
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[target.'cfg(windows)'.dependencies]
# Taskbar theme for the tray glyph: read and watch HKCU\...\Themes\Personalize. Already in Tauri's tree.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifier host check, GNOME button-layout, compositing check. Same version as Tauri's.
gtk = "=0.18.2"
# Media-key fallback when WebKitGTK ships without Media Session (DESKTOP.md 5).
tauri-plugin-global-shortcut = "=2.4.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
# Denied, not forbidden: the Windows taskbar watch (src/platform/windows.rs) calls the registry API.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
