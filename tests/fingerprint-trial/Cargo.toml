# The fingerprint trial (docs/adr/0016): decode a reference clip and candidate files, fingerprint them
# (Chromaprint's algorithm, pure Rust) and align the clip anywhere in each candidate. A measuring tool,
# not part of the hub: its own workspace, built only by hand.
[package]
name = "fptrial"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rusty-chromaprint = "0.3.0"
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "mkv", "ogg", "vorbis", "wav", "pcm", "alac", "opt-simd"] }
ruopus = "0.1"
serde_json = "1"
