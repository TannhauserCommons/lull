name: sourceforge
# Copies a Release's installers to SourceForge (sourceforge.net/projects/lull, folder <tag>/) and makes each
# platform's installer its default download there, so a visitor gets the one for their system. app.yml calls this
# after it publishes a v* tag's Release; run it by hand to mirror an older one. The .sig files and latest.json stay on
# GitHub: the app's updater reads only those (api.md, App releases).
# Secrets: SOURCEFORGE_SSH_KEY, a private key on the tannhauseropen account (for uploads), and SOURCEFORGE_API_KEY,
# that account's Releases API key (for the default downloads).
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      SOURCEFORGE_SSH_KEY:
        required: true
      SOURCEFORGE_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "The Release to mirror, e.g. v0.2.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sourceforge-${{ inputs.tag }}

env:
  TAG: ${{ inputs.tag }}
  FILES_URL: https://sourceforge.net/projects/lull/files

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: The Release's installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files \
            -p '*.exe' -p '*.AppImage' -p '*.deb' -p '*.rpm' -p '*.apk'
          ls -l files

      # The host key is SourceForge's published one for frs.sourceforge.net
      # (sourceforge.net/p/forge/documentation/SSH Key Fingerprints: ED25519 SHA256:209BDmH3jsRyO9UeGPPgLWPSegKmYCBIya0nR/AWWCY).
      - name: Upload
        env:
          SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/sourceforge
          chmod 600 ~/.ssh/sourceforge
          echo 'frs.sourceforge.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOQD35Ujalhh+JJkPvMckDlhu4dS7WH6NsOJ15iGCJLC' > ~/.ssh/known_hosts
          rsync -rtv --chmod=D755,F644 \
            -e 'ssh -i ~/.ssh/sourceforge -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            files/ "tannhauseropen@frs.sourceforge.net:/home/frs/project/lull/$TAG/"

      # SourceForge's Release API (sourceforge.net/p/forge/documentation/Using the Release API). Linux gets the x64
      # AppImage, which runs on any distribution; "others" covers Android. There is no Mac build.
      - name: Default downloads
        env:
          API_KEY: ${{ secrets.SOURCEFORGE_API_KEY }}
        run: |
          v=${TAG#v}
          default() {
            file=$1 label=$2; shift 2
            args=()
            for os in "$@"; do args+=(-d "default=$os"); done
            curl --fail-with-body -sS -X PUT -H 'Accept: application/json' "${args[@]}" \
              --data-urlencode "download_label=$label" --data-urlencode "api_key=$API_KEY" \
              "$FILES_URL/$TAG/$file"
            echo
          }
          default "lull_${v}_windows-x64-setup.exe" "lull $v for Windows" windows
          default "lull_${v}_amd64.AppImage" "lull $v for Linux" linux bsd solaris
          default "lull-${v}-android-arm64.apk" "lull $v for Android" others
