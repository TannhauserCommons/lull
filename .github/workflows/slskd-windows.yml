name: slskd-windows
# lull's slskd for Windows (ADR-0062): app/slskd/build.sh, run twice in different folders, must give the same
# bytes, and the bytes app/build.rs pins once it pins this build. The slskd contract calls it when the recipe or
# the pin changes; slskd-windows-publish calls it before attaching the zips to a release. Read-only on purpose:
# the queue calls it, and a called workflow may ask for no more than its caller grants, checked before any job
# is skipped (one asking for write here stopped every queue run).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true
    outputs:
      build:
        description: The build's name, such as 0.26.2-lull.1
        value: ${{ jobs.build.outputs.build }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      build: ${{ steps.same.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # No setup-dotnet: build.sh fetches the exact SDK and builds on it alone (setup-dotnet also adds the newest
      # LTS runtime, which the SDK then runs on).
      - run: sh app/slskd/build.sh "$RUNNER_TEMP/first"
      - run: sh app/slskd/build.sh "$RUNNER_TEMP/second"
      - id: same
        name: The same bytes twice, and the ones app/build.rs pins
        run: |
          cd "$RUNNER_TEMP/first"
          for zip in slskd-*.zip; do
            a=$(sha256sum "$zip" | cut -d' ' -f1)
            b=$(sha256sum "../second/$zip" | cut -d' ' -f1)
            [ "$a" = "$b" ] || { echo "::error::$zip differs between two builds ($a, $b): the recipe isn't reproducible"; exit 1; }
            # A pin names its zip in the URL and its sha256 beside it (app/build.rs, SLSKD).
            pinned=$(grep -A3 "$zip\"" "$GITHUB_WORKSPACE/app/build.rs" | grep -o '[0-9a-f]\{64\}' | head -n 1 || true)
            if [ -z "$pinned" ]; then
              echo "$zip: $a (not pinned in app/build.rs yet)"
            elif [ "$pinned" != "$a" ]; then
              echo "::error::$zip builds to $a, but app/build.rs pins $pinned"; exit 1
            else
              echo "$zip: $a, as pinned"
            fi
          done
          echo "build=$(ls slskd-*-win-x64.zip | sed -E 's/^slskd-(.*)-win-x64\.zip$/\1/')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: slskd-windows
          path: ${{ runner.temp }}/first/slskd-*.zip
          retention-days: 7
