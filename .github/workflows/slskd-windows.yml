name: slskd-windows
# lull's slskd for Windows (ADR-0062): app/slskd/build.sh, run twice in different folders, must give the same
# bytes, and the bytes app/build.rs pins once it pins this build. check.yml's `slskd-build` runs the same when a
# change touches the recipe or the pin; slskd-windows-publish calls this before attaching the zips to a release.
# Read-only on purpose: a called workflow may ask for no more than its caller grants, checked before any job is
# skipped.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true
    outputs:
      build:
        description: The build's name, such as 0.26.2-lull.1
        value: ${{ jobs.build.outputs.build }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      build: ${{ steps.same.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      # No setup-dotnet: build.sh fetches the exact SDK and builds on it alone (setup-dotnet also adds the newest
      # LTS runtime, which the SDK then runs on).
      # The pinned .NET SDK, kept by hash between runs (the second build reads what the first kept): a warm run
      # downloads nothing. Only main saves.
      - id: sdk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/pinned-downloads
          key: slskd-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/slskd/build.sh', 'app/slskd/global.json') }}
      # check.yml's `slskd-build`: two builds, the same bytes twice and the ones app/build.rs pins. The first build's
      # zips are kept for the publish.
      - name: mise run slskd:build
        run: mise run slskd:build
        env:
          DOWNLOADS_CACHE: ${{ runner.temp }}/pinned-downloads
          SLSKD_OUT: ${{ runner.temp }}/slskd
      - if: steps.sdk.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/pinned-downloads
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      - id: same
        name: The build's name
        run: |
          cd "$RUNNER_TEMP/slskd"
          echo "build=$(ls slskd-*-win-x64.zip | sed -E 's/^slskd-(.*)-win-x64\.zip$/\1/')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slskd-windows
          path: ${{ runner.temp }}/slskd/slskd-*.zip
          retention-days: 7
