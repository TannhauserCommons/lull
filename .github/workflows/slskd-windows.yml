name: slskd-windows
# lull's slskd for Windows (ADR-0062): app/slskd/build.sh, run twice in different folders, must give the same
# bytes, and the bytes app/build.rs pins once it pins this build. The queue runs it when the recipe or the pin
# changes. Run by hand on main with `publish`, it attaches the zips to a pre-release, slskd-<build>, where
# app/build.rs downloads them; pre-release, so the app's updater (releases/latest) never sees it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the zips to the slskd-<build> pre-release (main only; refuses one that exists)
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      build: ${{ steps.same.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: app/slskd/global.json
      - run: sh app/slskd/build.sh "$RUNNER_TEMP/first"
      - run: sh app/slskd/build.sh "$RUNNER_TEMP/second"
      - id: same
        name: The same bytes twice, and the ones app/build.rs pins
        run: |
          cd "$RUNNER_TEMP/first"
          for zip in slskd-*.zip; do
            a=$(sha256sum "$zip" | cut -d' ' -f1)
            b=$(sha256sum "../second/$zip" | cut -d' ' -f1)
            [ "$a" = "$b" ] || { echo "::error::$zip differs between two builds ($a, $b): the recipe isn't reproducible"; exit 1; }
            # A pin names its zip in the URL and its sha256 beside it (app/build.rs, SLSKD).
            pinned=$(grep -A3 "$zip\"" "$GITHUB_WORKSPACE/app/build.rs" | grep -o '[0-9a-f]\{64\}' | head -n 1 || true)
            if [ -z "$pinned" ]; then
              echo "$zip: $a (not pinned in app/build.rs yet)"
            elif [ "$pinned" != "$a" ]; then
              echo "::error::$zip builds to $a, but app/build.rs pins $pinned"; exit 1
            else
              echo "$zip: $a, as pinned"
            fi
          done
          echo "build=$(ls slskd-*-win-x64.zip | sed -E 's/^slskd-(.*)-win-x64\.zip$/\1/')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: slskd-windows
          path: ${{ runner.temp }}/first/slskd-*.zip
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: slskd-windows
          path: zips
      # Never mistaken for a lull release: the tag is outside v* (F-Droid, the release scripts), it is a pre-release
      # and not latest (the updater reads releases/latest), and its page says what it is. AGPL: it names the source
      # and shows the patch.
      - env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          tag=$(sed -n 's/^UPSTREAM_TAG=//p' app/slskd/build.sh)
          commit=$(sed -n 's/^UPSTREAM_COMMIT=//p' app/slskd/build.sh)
          here="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          {
            echo "**Not a lull release.** This is slskd $tag, a program lull's Windows app bundles, with one line changed by lull. Get lull itself from its own releases (tagged v*)."
            echo
            echo "**What changed:** slskd opens the file it is downloading so that others may read it while it arrives (FileShare.Read, where slskd has FileShare.None). Writing it stays slskd's alone. Without this, Windows stops lull streaming a song while slskd downloads it. Nothing else differs."
            echo
            echo "**Source** (slskd is AGPL-3.0):"
            echo "- slskd's own source at tag [$tag](https://github.com/slskd/slskd/tree/$tag), commit $commit"
            echo "- lull's patch: [app/slskd/share-for-reading.patch]($here/app/slskd/share-for-reading.patch), shown below"
            echo "- how it is built: [app/slskd/build.sh]($here/app/slskd/build.sh), run by this repository's slskd-windows workflow, which builds twice and checks both give these bytes"
            echo
            echo "Each zip holds slskd.exe, slskd's LICENSE, a NOTICE of the change and the patch. lull's Windows app downloads them when it is built, checked by sha256 (app/build.rs)."
            echo
            echo "~~~diff"
            cat app/slskd/share-for-reading.patch
            echo "~~~"
          } > notes.md
          gh release create "slskd-$BUILD" zips/slskd-*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "slskd $BUILD: a component of lull's Windows app, not a lull release" \
            --notes-file notes.md
