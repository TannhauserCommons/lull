name: server-package
# The Linux server package (ADR-0090): lull built as the image builds it (the web UI minified into the binary), with
# the slskd, yt-dlp and Deno that app/build.rs pins, as a .deb, an .rpm and a .tar.gz (packaging/linux/). Each
# package is installed as a service in a fresh Ubuntu, Debian or Fedora running systemd and held to the hub contract
# (tests/hub-contract/). On the oldest glibc of each architecture (Ubuntu 22.04), so the packages run on older
# distributions too. A release (app.yml, on a v* tag) builds both architectures and the hub kits a hub updates
# itself with, their manifests signed with the desktop updater's key, and attaches them with the apps.
on:
  # A branch's packages, by hand (`gh workflow run server-package --ref <branch>`): kept as workflow artifacts.
  workflow_dispatch:
  # app.yml's release, on a v* tag. check.yml's `package` jobs build and test x64 on every change to the package.
  workflow_call:
    inputs:
      ref:
        description: The commit to build
        type: string
        required: true
      build-release:
        description: The release the commit holds everything of (scripts/image-save.sh); empty for a release
        type: string
        default: ""
      build-changes:
        description: Changes since that release
        type: string
        default: ""
      release:
        description: A release's build (app.yml on a v* tag), both architectures, the kits' manifests signed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.release && '[{"os":"ubuntu-22.04","arch":"x64"},{"os":"ubuntu-22.04-arm","arch":"arm64"}]' || '[{"os":"ubuntu-22.04","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      # The web UI as the binary embeds it, the Dockerfile's web stage: Webamp vendored, every file minified and
      # pre-compressed, in place of web/ (this checkout only).
      - name: Web UI
        run: |
          sh scripts/vendor-web.sh
          npm ci --prefix scripts/web-dist --ignore-scripts --no-audit --no-fund
          node scripts/web-dist/build.mjs web "$RUNNER_TEMP/web-dist"
          rm -rf web && mv "$RUNNER_TEMP/web-dist" web
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-package-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What the hub says it is (lull_core::build), as the image says it.
      - id: version
        env:
          RELEASE: ${{ inputs.build-release }}
          CHANGES: ${{ inputs.build-changes }}
          COMMIT: ${{ inputs.ref || github.sha }}
        run: |
          if [ -n "$RELEASE" ] && [ "${CHANGES:-0}" != 0 ]; then
            version="$RELEASE+$CHANGES.$(printf %s "$COMMIT" | cut -c1-7)"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # As the image builds it, but installed as the package: Settings › App and the updates say so (a kit's lull
      # run by an image's hub runs as the image's, launch.rs). lull's own Last.fm app key when the caller passes it.
      - name: lull
        env:
          LULL_BUILD_RELEASE: ${{ inputs.build-release }}
          LULL_BUILD_CHANGES: ${{ inputs.build-changes }}
          LULL_BUILD_COMMIT: ${{ inputs.build-release && (inputs.ref || github.sha) || '' }}
          LULL_BUILD_INSTALL: package
          LULL_LASTFM_API_KEY: ${{ secrets.LULL_LASTFM_API_KEY }}
          LULL_LASTFM_API_SECRET: ${{ secrets.LULL_LASTFM_API_SECRET }}
        run: cargo build --release --locked --bin lull
      # nfpm, slskd, yt-dlp and Deno, the pinned files the package carries or is built with, kept by hash between runs: a
      # warm run downloads nothing, so GitHub's release host answering 5xx can't fail it. Only main saves.
      - id: downloads
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pinned-downloads
          key: server-package-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/build.rs', 'packaging/linux/build.sh') }}
      - run: sh packaging/linux/build.sh target/release/lull "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/packages"
        env:
          DOWNLOADS_CACHE: ${{ runner.temp }}/pinned-downloads
      - if: steps.downloads.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pinned-downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # A hub runs a kit only when the manifest carries this signature (kit.rs): the desktop updater's key, the
      # Tauri CLI the app bundles with.
      - name: Sign the kit's manifest
        if: inputs.release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cli=$(node -p "require('./app/package.json').devDependencies['@tauri-apps/cli']")
          for manifest in "$RUNNER_TEMP"/packages/lull-hub-*.json; do
            npx --yes "@tauri-apps/cli@$cli" signer sign --password "" "$manifest"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lull-server-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/
          retention-days: 7

  # The contracts below are check.yml's `package-*` jobs: the same `mise run` task on the same runner, so a release
  # tests its packages exactly as a pull request does (scripts/ci/package-*.sh). Only main saves a cache; a tag reads main's.

  # Installed as a service in a fresh Ubuntu, Debian or Fedora running systemd.
  contract:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lull-server-linux-x64
          path: ${{ runner.temp }}/packages
      - name: mise run package:contract
        run: mise run package:contract ${{ matrix.distro }}

  # The listener's existing Jellyfin (tests/hub-contract/jellyfin.sh): a real one, set up through its startup API, and
  # the package's hub pointed at it by `lull setup`'s questions. ffmpeg's packages (the fixture library) come from
  # main's Actions cache, as in check.yml (apt_install keeps them in APT_KEEP, scripts/ci/lib.sh).
  jellyfin:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lull-server-linux-x64
          path: ${{ runner.temp }}/packages
      - id: apt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apt/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-jellyfin-${{ hashFiles('scripts/ci/package-jellyfin.sh') }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-jellyfin-
      - name: mise run package:jellyfin
        run: mise run package:jellyfin
        env:
          APT_KEEP: ${{ runner.temp }}/apt
      - if: ${{ !cancelled() && steps.apt.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/apt/*.deb
          key: apt-${{ runner.os }}-${{ runner.arch }}-jellyfin-${{ hashFiles('scripts/ci/package-jellyfin.sh') }}

  # A hub updating itself (tests/hub-contract/self-update.sh): two debug builds, a kit signed with a key made here and
  # thrown away, a stand-in for GitHub's newest release. Only a debug build reads that key and that stand-in.
  self-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run toolchain
        run: mise run toolchain
      # The cache check.yml's `package-self-update` saves on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: self-update-self-update
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run package:self-update
        run: mise run package:self-update

  # The listener's logins across an update (tests/hub-contract/secrets-update.sh, ADR-0091): the last release before the
  # credentials' vault, built from its tag, updated to this commit with the `secrets` switch on, through a kit that
  # fails its health window and then one that starts.
  secrets-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run toolchain
        run: mise run toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: self-update-self-update
          save-if: false
      # The release's source, keyed on the script that names the release (a tag doesn't move). Only main saves.
      - id: release
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/pinned-downloads
          key: release-source-${{ hashFiles('scripts/ci/package-secrets-update.sh') }}
      - name: mise run package:secrets-update
        run: mise run package:secrets-update
        env:
          DOWNLOADS_CACHE: ${{ runner.temp }}/pinned-downloads
      - if: steps.release.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/pinned-downloads
          key: ${{ steps.release.outputs.cache-primary-key }}
