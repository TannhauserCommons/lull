name: release
# Cuts a release on the owner's word (ADR-0098): the integrator session runs this when the owner says to release, or the
# owner runs it from the Actions tab or the GitHub app. scripts/release.sh makes the release commit on main's newest
# green commit (ADR-0097) with the draft's notes and tags it, and the version commit goes to the branch release-X.Y.Z
# for a pull request. The tag stays here: pushing it publishes (app.yml's installers, updater files, APK and GitHub
# Release, release-image.yml's :X.Y.Z and :latest, F-Droid's build), so the session pushes it only once check / gate
# passed on the version's pull request (ADR-0103), with the commands this run writes in its summary. `rehearse` does
# everything but push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version, X.Y.Z (the draft proposes one)"
        required: true
        type: string
      rehearse:
        description: "Make the release commit and tag in the runner only: push and publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - run: rustup toolchain install
      # release.sh sets the version with `cargo update --offline`: the registry has to be here first.
      - run: cargo fetch --locked && cargo fetch --locked --manifest-path app/Cargo.toml
      - run: |
          git config user.name TannhauserCommons
          git config user.email 350945459+TannhauserCommons@users.noreply.github.com
      # The draft's notes, as a person left them, are what's new (release.sh takes the file when it is there).
      - name: Notes from the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]{1,3}\.[0-9]{1,3}$' || { echo "::error::give the version as X.Y.Z"; exit 1; }
          code=$(echo "$VERSION" | awk -F. '{ print $1 * 1000000 + $2 * 1000 + $3 }')
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft and .name == "Next release")][0].body // empty' \
            > "$RUNNER_TEMP/draft.md"
          [ -s "$RUNNER_TEMP/draft.md" ] || { echo "::error::no 'Next release' draft: run release-draft first"; exit 1; }
          mkdir -p fastlane/metadata/android/en-US/changelogs
          node scripts/release-notes.mjs notes "$RUNNER_TEMP/draft.md" > "fastlane/metadata/android/en-US/changelogs/$code.txt"
          sed 's/^/  /' "fastlane/metadata/android/en-US/changelogs/$code.txt"
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          TZ=UTC sh scripts/release.sh "$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "v$VERSION^{commit}")" >> "$GITHUB_OUTPUT"
          git log -1 --stat "v$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Push the version's branch
        if: ${{ !inputs.rehearse }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          COMMIT: ${{ steps.tag.outputs.commit }}
        run: |
          set -eu
          git push origin "$COMMIT:refs/heads/release-${TAG#v}"
          # A pull request opened with this token would start no check, so the session that ran the release opens it
          # with the App's token. The tag goes up last, once check / gate passed on the commit (ADR-0103); a push
          # with this job's token would start no workflow anyway.
          {
            echo "### The version for main, then the tag"
            echo "Open its pull request with the App's token, so \`check\` runs on it. Once \`check / gate\` is green, tag the commit and push the tag, which publishes the release; then merge the pull request as any change:"
            echo '```'
            echo "gh pr create --repo $GITHUB_REPOSITORY --base main --head release-${TAG#v} --fill"
            echo "gh pr checks release-${TAG#v} --repo $GITHUB_REPOSITORY --watch"
            echo "git fetch origin release-${TAG#v} && sh scripts/release-gate.sh $COMMIT && TZ=UTC git tag -a $TAG -m \"lull ${TAG#v}\" $COMMIT && git push origin $TAG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The next landing drafts the release after this one.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft and .name == "Next release")][0].id // empty')
          [ -z "$id" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
