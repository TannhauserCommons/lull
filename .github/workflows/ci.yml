name: ci
on:
  pull_request:
  # The checks on any branch, by hand (`gh workflow run ci --ref <branch>`). The queue publishes the image.
  workflow_dispatch:
  # The queue (ADR-0095) runs these checks on its candidate.
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !inputs.ref }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # The release scopes check below reads every commit since the last v* tag.
          fetch-depth: 0
      - run: rustup toolchain install
      # Only main saves (ADR-0097): another ref's cache can't be read by anyone else.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The web UI's pure helpers (web/align.js): node's own test runner, no packages.
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - run: node --test "tests/web/*.test.mjs"
      # The release draft (release-draft.yml) fails on main after landing when a feat or fix uses a scope
      # scripts/release-areas.tsv doesn't map; drawing it here fails the candidate instead.
      - run: node scripts/release-notes.mjs draft > /dev/null
      # app/ is its own workspace but depends on the hub by path: a dependency change in crates/*
      # must update app/Cargo.lock in the same commit, or the app's --locked builds break.
      - run: cargo update --manifest-path app/Cargo.toml --workspace --locked

