name: ci
on:
  push:
    branches: [main]
  pull_request:
  # The checks on any branch, by hand (`gh workflow run ci --ref <branch>`); only main publishes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # Only main saves (ADR-0097): another ref's cache can't be read by anyone else.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The web UI's pure helpers (web/align.js): node's own test runner, no packages.
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - run: node --test "tests/web/*.test.mjs"
      # app/ is its own workspace but depends on the hub by path: a dependency change in crates/*
      # must update app/Cargo.lock in the same commit, or the app's --locked builds break.
      - run: cargo update --manifest-path app/Cargo.toml --workspace --locked

  image:
    # Every green push to main publishes ghcr.io/<owner>/lull:main and :sha-<short>; nothing else
    # does (a run by hand on another branch, a pull request).
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lull
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            lastfm_key=${{ secrets.LULL_LASTFM_API_KEY }}
            lastfm_secret=${{ secrets.LULL_LASTFM_API_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "Pushed ghcr.io/${{ github.repository_owner }}/lull@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
