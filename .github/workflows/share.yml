name: share
# lull's share links (share/, ADR-0034): a Cloudflare Worker. check.yml's `share` tests it as it deploys, in
# Cloudflare's local runtime with every outside service faked, and checks the Android app claims every share host.
# `deploy` publishes main's Worker when main.yml lands a change to it (or by hand); it waits for the Cloudflare account's secrets
# (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, from Bitwarden's lull/ items) and says so until they exist.
on:
  # On main, after main.yml's check passed on the commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: share-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Dispatched on main by hand or by main.yml after its check passed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: share-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: share
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - id: account
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deployed: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets aren't set yet (ADR-0034, Cost)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.account.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.account.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24.11"
          cache: npm
          cache-dependency-path: share/package-lock.json
      - if: steps.account.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
      - if: steps.account.outputs.ready == 'true'
        run: npx wrangler deploy
      # Last.fm's key, for the cover chain's name lookup: the hub's own key, as a Worker secret.
      - if: steps.account.outputs.ready == 'true'
        env:
          LASTFM_API_KEY: ${{ secrets.LULL_LASTFM_API_KEY }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({ LASTFM_API_KEY: process.env.LASTFM_API_KEY }))' | npx wrangler secret bulk
