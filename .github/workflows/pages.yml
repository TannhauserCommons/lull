# lull's public "open" page (site/, ADR-0032) on GitHub Pages: https://tannhausercommons.github.io/lull/open.
# The repository's Pages source must be "GitHub Actions" (Settings > Pages). The share Worker's build gathers its
# files (the page, lull's icon, font and base tokens from web/), so both hosts serve the same page and it has no
# copy of its own.
name: pages

# The queue starts it when a landed change touches the site (ADR-0095); by hand too.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only main's site is published, by hand too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}open
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - name: Assemble the site
        run: |
          node share/build.mjs
          mkdir -p _site
          cd share/public && cp open.html open.css open.js look.css app-icon.svg nunito-latin.woff2 ../../_site/
          touch ../../_site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
      - id: deployment
        uses: actions/deploy-pages@v4
