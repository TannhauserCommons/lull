name: app
# The Tauri app (app/). A quick check whenever it, the hub it embeds or its web pieces change;
# Windows and Linux bundles (x64 and arm64) and the Android APK on a v* tag (attached to the tag's Release,
# with the signed updater files and latest.json) or by hand (workflow artifacts, no updater files).
# `mise run release X.Y.Z` makes the tag (scripts/release.sh). Path filters don't apply to tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "crates/**", "web/desktop/**", "web/assets/icons/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "crates/**", "web/desktop/**", "web/assets/icons/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous push's run; a manual run (installers to test) is in its own
# group, so other pushes to main don't cancel it.
concurrency:
  group: app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Tauri's documented Linux build prerequisites (WebKitGTK 4.1, AppIndicator, rsvg for icons, xdo).
  LINUX_DEPS: libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  check:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: node --check web/desktop/desktop.js
      - working-directory: app
        run: cargo fmt --check
      - working-directory: app
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: app
        run: cargo test --locked

  bundle:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Each build runs natively on its own architecture (GitHub's arm64 runners), so the bundled
        # slskd, yt-dlp and Deno are each target's own (app/build.rs). `updater` is Tauri's platform
        # key for latest.json (scripts/updater-manifest.mjs).
        include:
          # 22.04: the oldest supported glibc, so the AppImage and .deb run on older distros too.
          - os: ubuntu-22.04
            arch: x64
            bundles: deb,rpm,appimage
            updater: linux-x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            bundles: deb,rpm,appimage
            updater: linux-aarch64
          - os: windows-latest
            arch: x64
            bundles: nsis
            updater: windows-x86_64
          - os: windows-11-arm
            arch: arm64
            bundles: nsis
            updater: windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - working-directory: app
        run: npm ci --no-audit --no-fund
      # A tag sets the version (v1.2.0 -> 1.2.0) and signs the updater files with the release key
      # (it has no password). The in-process hub gets lull's own Last.fm key compiled in, as the
      # image does (core::config, option_env!).
      - working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LULL_LASTFM_API_KEY: ${{ secrets.LULL_LASTFM_API_KEY }}
          LULL_LASTFM_API_SECRET: ${{ secrets.LULL_LASTFM_API_SECRET }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            config="{\"version\":\"${GITHUB_REF_NAME#v}\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            config='{}'
          fi
          npx tauri build --ci --bundles ${{ matrix.bundles }} --config "$config"
          # The updater updates a .deb or .rpm install from its own kind of package, so those need a
          # signature too; the bundler signs only what it re-uses itself (the AppImage, the installer).
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$RUNNER_OS" = Linux ]; then
            for f in target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm; do
              [ -f "$f.sig" ] || npx tauri signer sign --password "" "$f"
            done
          fi
          # This build's entries in latest.json; the release job merges every build's.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node ../scripts/updater-manifest.mjs entries ${{ matrix.updater }} target/release/bundle \
              > target/release/bundle/updater-${{ matrix.updater }}.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lull-desktop-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            app/target/release/bundle/nsis/*.exe
            app/target/release/bundle/nsis/*.exe.sig
            app/target/release/bundle/deb/*.deb
            app/target/release/bundle/deb/*.deb.sig
            app/target/release/bundle/rpm/*.rpm
            app/target/release/bundle/rpm/*.rpm.sig
            app/target/release/bundle/appimage/*.AppImage
            app/target/release/bundle/appimage/*.AppImage.sig
            app/target/release/bundle/updater-*.json

  # Android: an APK for arm64 phones. A debug build checks every change (Rust for Android and the
  # Kotlin player); a v* tag builds the release APK signed with the release keystore.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: android
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - working-directory: app
        run: npm ci --no-audit --no-fund
      # The runner image ships the SDK and NDKs; Tauri needs NDK_HOME.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Release keystore
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - working-directory: app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            npx tauri android build --ci --apk --target aarch64 --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}"
            cp gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "lull-${GITHUB_REF_NAME#v}-android-arm64.apk"
          else
            npx tauri android build --ci --apk --target aarch64 --debug
            cp gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk lull-android-arm64-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lull-android
          if-no-files-found: error
          path: app/lull-*.apk

  release:
    needs: [bundle, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      # Each artifact keeps the bundler's folders (nsis/, deb/, appimage/...): the Release takes the
      # files alone.
      - run: find bundles -mindepth 2 -type f -exec mv -t bundles {} + && find bundles -mindepth 1 -type d -delete
      # latest.json is what the app's updater reads (tauri.conf.json plugins.updater.endpoints): for
      # each Windows and Linux architecture its installer, and its AppImage, .deb or .rpm (whichever
      # this install came from); for Android, which has no Tauri updater, the APK
      # (app/src/mobile/update.rs). It fails unless every platform is there.
      - name: Updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/updater-manifest.mjs manifest "${TAG#v}" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" bundles
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "lull $TAG" --generate-notes
          gh release upload "$TAG" bundles/* --repo "$GITHUB_REPOSITORY" --clobber
