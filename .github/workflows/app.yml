name: app
# The Tauri app (app/). A quick check whenever it or its web pieces change; Windows and
# Linux bundles on a v* tag (attached to that tag's GitHub Release) or by hand (workflow artifacts).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "web/desktop/**", "web/assets/icons/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "web/desktop/**", "web/assets/icons/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Tauri's documented Linux build prerequisites (WebKitGTK 4.1, AppIndicator, rsvg for icons, xdo).
  LINUX_DEPS: libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  check:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: node --check web/desktop/desktop.js
      - working-directory: app
        run: cargo fmt --check
      - working-directory: app
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: app
        run: cargo test --locked

  bundle:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest supported glibc, so the AppImage and .deb run on older distros too.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - working-directory: app
        run: npm ci --no-audit --no-fund
      - working-directory: app
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: lull-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/target/release/bundle/nsis/*.exe
            app/target/release/bundle/deb/*.deb
            app/target/release/bundle/rpm/*.rpm
            app/target/release/bundle/appimage/*.AppImage

  release:
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "lull $TAG" --generate-notes
          gh release upload "$TAG" bundles/* --repo "$GITHUB_REPOSITORY" --clobber
