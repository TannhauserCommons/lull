name: app
# The Tauri app (app/). A quick check whenever it, the hub it embeds or its web pieces change;
# Windows and Linux bundles on a v* tag (attached to that tag's GitHub Release, with the signed
# updater files and latest.json) or by hand (workflow artifacts, no updater files).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "crates/**", "web/desktop/**", "web/assets/icons/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "crates/**", "web/desktop/**", "web/assets/icons/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the previous push's run; a manual run (installers to test) is in its own
# group, so other pushes to main don't cancel it.
concurrency:
  group: app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Tauri's documented Linux build prerequisites (WebKitGTK 4.1, AppIndicator, rsvg for icons, xdo).
  LINUX_DEPS: libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  check:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: node --check web/desktop/desktop.js
      - working-directory: app
        run: cargo fmt --check
      - working-directory: app
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: app
        run: cargo test --locked

  bundle:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest supported glibc, so the AppImage and .deb run on older distros too.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - working-directory: app
        run: npm ci --no-audit --no-fund
      # A tag sets the version (v1.2.0 -> 1.2.0) and signs the updater files with the release key
      # (it has no password). The in-process hub gets lull's own Last.fm key compiled in, as the
      # image does (core::config, option_env!).
      - working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LULL_LASTFM_API_KEY: ${{ secrets.LULL_LASTFM_API_KEY }}
          LULL_LASTFM_API_SECRET: ${{ secrets.LULL_LASTFM_API_SECRET }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            config="{\"version\":\"${GITHUB_REF_NAME#v}\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            config='{}'
          fi
          npx tauri build --ci --bundles ${{ matrix.bundles }} --config "$config"
      - uses: actions/upload-artifact@v4
        with:
          name: lull-desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/target/release/bundle/nsis/*.exe
            app/target/release/bundle/nsis/*.exe.sig
            app/target/release/bundle/deb/*.deb
            app/target/release/bundle/rpm/*.rpm
            app/target/release/bundle/appimage/*.AppImage
            app/target/release/bundle/appimage/*.AppImage.sig

  # Android: an APK for arm64 phones. A debug build checks every change (Rust for Android and the
  # Kotlin player); a v* tag builds the release APK signed with the release keystore.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: android
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - working-directory: app
        run: npm ci --no-audit --no-fund
      # The runner image ships the SDK and NDKs; Tauri needs NDK_HOME.
      - run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Release keystore
        if: github.ref_type == 'tag'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - working-directory: app
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            npx tauri android build --ci --apk --target aarch64 --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}"
            cp gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "lull-${GITHUB_REF_NAME#v}-android-arm64.apk"
          else
            npx tauri android build --ci --apk --target aarch64 --debug
            cp gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk lull-android-arm64-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: lull-android
          if-no-files-found: error
          path: app/lull-*.apk

  release:
    needs: [bundle, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      # latest.json is what the app's updater reads (tauri.conf.json plugins.updater.endpoints).
      - name: Updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          win=$(cd bundles && ls *-setup.exe)
          appimage=$(cd bundles && ls *.AppImage)
          jq -n --arg v "${TAG#v}" --arg base "$base" \
            --arg win "$win" --rawfile winsig "bundles/$win.sig" \
            --arg app "$appimage" --rawfile appsig "bundles/$appimage.sig" \
            '{version: $v, pub_date: (now | todate), platforms: {
               "windows-x86_64": {url: "\($base)/\($win)", signature: $winsig},
               "linux-x86_64": {url: "\($base)/\($app)", signature: $appsig}}}' > bundles/latest.json
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "lull $TAG" --generate-notes
          gh release upload "$TAG" bundles/* --repo "$GITHUB_REPOSITORY" --clobber
