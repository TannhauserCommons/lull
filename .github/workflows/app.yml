name: app
# The Tauri app (app/). The queue (ADR-0095) runs its checks, and the Android build when Android's
# parts change, on every candidate that touches the app or the hub it embeds. Windows and Linux bundles
# (x64 and arm64) and the Android APK on a v* tag (attached to the tag's Release, with the signed updater
# files and latest.json) or by hand (workflow artifacts, no updater files). A run by hand on main also
# saves the bundles' caches for the next tag (ADR-0097); the queue starts one when the lockfiles change.
# `mise run release X.Y.Z` makes the tag (scripts/release.sh).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["app/**", "crates/**", "web/desktop/**", "web/assets/icons/**", "scripts/android-*.sh", "rust-toolchain.toml", ".github/workflows/app.yml"]
  workflow_dispatch:
    inputs:
      gradle-verification:
        description: "Write Gradle's dependency checksums (gradle/verification-metadata.xml) from the Android build, after a dependency changes"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true
      checks:
        description: The app's checks on Linux and Windows
        type: boolean
        default: true
      android:
        description: The Android build
        type: boolean
        default: true

permissions:
  contents: read

# One run at a time per event and ref, and per candidate for the queue's. A new pull request push
# cancels the old run.
concurrency:
  group: app-${{ inputs.ref || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tauri's documented Linux build prerequisites (WebKitGTK 4.1, AppIndicator, rsvg for icons, xdo), and
  # ALSA's headers for native Classic's sound (cpal; libopus builds with the runner's CMake).
  LINUX_DEPS: libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

jobs:
  # A queue candidate, a pull request, or a run by hand on any branch (its checks, then its bundles).
  check:
    if: github.ref_type != 'tag' && (!inputs.ref || inputs.checks)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      # Only main saves (ADR-0097): another ref's cache can't be read by anyone else.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: node --check web/desktop/desktop.js
      - working-directory: app
        run: cargo fmt --check
      - working-directory: app
        run: cargo clippy --all-targets --locked -- -D warnings
      - working-directory: app
        run: cargo test --locked

  bundle:
    if: ${{ !inputs.ref && !inputs.gradle-verification && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        # Each build runs natively on its own architecture (GitHub's arm64 runners), so the bundled
        # slskd, yt-dlp and Deno are each target's own (app/build.rs). `updater` is Tauri's platform
        # key for latest.json (scripts/updater-manifest.mjs).
        include:
          # 22.04: the oldest supported glibc, so the AppImage and .deb run on older distros too.
          - os: ubuntu-22.04
            arch: x64
            bundles: deb,rpm,appimage
            updater: linux-x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            bundles: deb,rpm,appimage
            updater: linux-aarch64
          - os: windows-latest
            arch: x64
            bundles: nsis
            updater: windows-x86_64
          - os: windows-11-arm
            arch: arm64
            bundles: nsis
            updater: windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - run: rustup toolchain install
      # Main warms what a tag restores (ADR-0097): a tag can read main's caches, never another tag's.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
      - working-directory: app
        run: npm ci --no-audit --no-fund
      # A tag sets the version (v1.2.0 -> 1.2.0) and signs the updater files with the release key
      # (it has no password). The in-process hub gets lull's own Last.fm key compiled in, as the
      # image does (core::config, option_env!).
      - working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          LULL_LASTFM_API_KEY: ${{ secrets.LULL_LASTFM_API_KEY }}
          LULL_LASTFM_API_SECRET: ${{ secrets.LULL_LASTFM_API_SECRET }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            config="{\"version\":\"${GITHUB_REF_NAME#v}\",\"bundle\":{\"createUpdaterArtifacts\":true}}"
          else
            config='{}'
          fi
          npx tauri build --ci --bundles ${{ matrix.bundles }} --config "$config"
          # The bundler names the installer lull_<v>_x64-setup.exe; the Release says Windows in it
          # (lull_<v>_windows-x64-setup.exe), so nobody has to guess. Renamed before latest.json's
          # entries are written, so the updater points at the new name; the signature covers the
          # bytes, not the name.
          if [ "$RUNNER_OS" = Windows ]; then
            for f in target/release/bundle/nsis/*-setup.exe target/release/bundle/nsis/*-setup.exe.sig; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in *_windows-*) continue ;; esac
              mv "$f" "$(dirname "$f")/$(basename "$f" | sed -E 's/_(x64|arm64)-setup/_windows-\1-setup/')"
            done
          fi
          # The updater updates a .deb or .rpm install from its own kind of package, so those need a
          # signature too; the bundler signs only what it re-uses itself (the AppImage, the installer).
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$RUNNER_OS" = Linux ]; then
            for f in target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm; do
              [ -f "$f.sig" ] || npx tauri signer sign --password "" "$f"
            done
          fi
          # This build's entries in latest.json; the release job merges every build's.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node ../scripts/updater-manifest.mjs entries ${{ matrix.updater }} target/release/bundle \
              > target/release/bundle/updater-${{ matrix.updater }}.json
          fi
      # The hub's sidecars (app/build.rs fetched this target's own) run on this architecture, as
      # the image runs its yt-dlp and Deno before it ships them.
      - working-directory: app/binaries
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          exe=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          for tool in slskd yt-dlp deno; do "./$tool-$target$exe" --version; done
      - uses: actions/upload-artifact@v4
        with:
          name: lull-desktop-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            app/target/release/bundle/nsis/*.exe
            app/target/release/bundle/nsis/*.exe.sig
            app/target/release/bundle/deb/*.deb
            app/target/release/bundle/deb/*.deb.sig
            app/target/release/bundle/rpm/*.rpm
            app/target/release/bundle/rpm/*.rpm.sig
            app/target/release/bundle/appimage/*.AppImage
            app/target/release/bundle/appimage/*.AppImage.sig
            app/target/release/bundle/updater-*.json

  # Android: the APK for arm64 phones, built the way F-Droid builds it (packaging/fdroid/): in
  # F-Droid's build image, by scripts/android-build.sh, with the toolchains pinned. Two builds side by
  # side: `signed` (a v* tag signs it with the release keystore, other runs with a throwaway key: an APK
  # to try), which also checks that no non-free library got in (the Gradle dependency tree and F-Droid's
  # scanner), and `clean`, unsigned from a clean clone in another folder. android-compare then requires
  # the two to match except for the signature, which is what lets F-Droid ship the release APK.
  android:
    if: ${{ !inputs.ref || inputs.android }}
    strategy:
      fail-fast: false
      matrix:
        build: [signed, clean]
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
    env:
      ANDROID_HOME: /opt/android-sdk
      NDK_HOME: /opt/android-sdk/ndk/28.2.13676358
      CARGO_HOME: /opt/cargo
      # Gradle's downloads in a folder of their own, by an absolute path: the cache action inside this container
      # resolves `~` to another home than the steps' HOME (/github/home), so `~/.gradle` saved nothing and every
      # build fetched everything from Maven Central, which limits shared runners (HTTP 429).
      GRADLE_USER_HOME: /opt/gradle
      RUSTUP_HOME: /opt/rustup
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # What F-Droid's recipe installs: Debian's rustup and the NDK, then (after the cache) the pinned
      # Rust toolchain and the Tauri CLI from source.
      - name: Toolchains
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential rustup sdkmanager fdroidserver
          sdkmanager --install "ndk;28.2.13676358"
      # Saved as soon as the Tauri CLI is built, not at the end, and only by main's signed build: a
      # tag or a branch reads main's.
      - id: cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/bin
            /opt/cargo/.crates.toml
            /opt/cargo/.crates2.json
          key: android-cargo-${{ hashFiles('app/Cargo.lock', 'app/package.json', 'rust-toolchain.toml') }}
          restore-keys: android-cargo-
      - run: sh scripts/android-toolchains.sh
      - if: steps.cargo.outputs.cache-hit != 'true' && matrix.build == 'signed' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/bin
            /opt/cargo/.crates.toml
            /opt/cargo/.crates2.json
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      # Gradle's downloads (its distribution and the libraries the APK builds with), never what it built: both
      # builds still compile everything. Saved only by main, per build (the clean one uses the wrapper).
      - id: gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/gradle/caches/modules-2
            /opt/gradle/wrapper/dists
            /github/home/.cache/gradlew-fdroid
          key: android-gradle-${{ matrix.build }}-${{ hashFiles('app/gen/android/**/*.gradle.kts', 'app/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ matrix.build }}-
      - name: Signing key
        if: matrix.build == 'signed'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            ANDROID_KEYSTORE_PASSWORD=throwaway ANDROID_KEY_ALIAS=test ANDROID_KEY_PASSWORD=throwaway
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass throwaway -keypass throwaway \
              -alias test -dname CN=lull-test -keyalg RSA -keysize 2048 -validity 30
          fi
          cat > app/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      # As F-Droid's scanner does before its build: no prebuilt Gradle wrapper. The clean clone keeps
      # it, so the two builds also cover both ways Gradle starts.
      - name: Signed build
        if: matrix.build == 'signed'
        env:
          # Writing the checksums anew: the old ones would stop the build at what they lack.
          WRITE_CHECKSUMS: ${{ inputs.gradle-verification }}
        run: |
          rm app/gen/android/gradlew app/gen/android/gradlew.bat app/gen/android/gradle/wrapper/gradle-wrapper.jar
          if [ "$WRITE_CHECKSUMS" = true ]; then rm -f app/gen/android/gradle/verification-metadata.xml; fi
          sh scripts/android-build.sh
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$RUNNER_TEMP/apk/"
      # Gradle checks every dependency against these checksums, downloaded or from the cache; after a dependency
      # changes, a run by hand with gradle-verification writes them again (docs/context/android.md).
      - name: Write Gradle's dependency checksums
        if: matrix.build == 'signed' && inputs.gradle-verification
        working-directory: app/gen/android
        # The libraries the APK resolves, without the Rust tasks (they use none, and run only inside the Tauri CLI):
        # arm64 alone, as android-build.sh builds. From an empty Gradle home, so every file a fresh build reads is
        # fetched and written down, not only those this run happens to resolve again.
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-fresh
        run: |
          ./gradlew --write-verification-metadata sha256 --refresh-dependencies :app:assembleUniversalRelease \
            -PtargetList=aarch64 -PabiList=arm64-v8a -ParchList=arm64 \
            -x rustBuildUniversalRelease -x rustBuildArm64Release
      - if: matrix.build == 'signed' && inputs.gradle-verification
        uses: actions/upload-artifact@v4
        with:
          name: gradle-verification-metadata
          path: app/gen/android/gradle/verification-metadata.xml
          if-no-files-found: error
      - name: No non-free libraries
        if: matrix.build == 'signed'
        run: |
          apk=app/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          (cd app/gen/android && ./gradlew -q :app:dependencies --configuration universalReleaseRuntimeClasspath) > "$RUNNER_TEMP/deps.txt"
          cat "$RUNNER_TEMP/deps.txt"
          if grep -Ei 'com\.google\.(android\.gms|firebase|mlkit)|play-services|crashlytics' "$RUNNER_TEMP/deps.txt"; then
            echo "::error::A non-free Google library is in the APK's dependencies (F-Droid can't ship it)"; exit 1
          fi
          fdroid scanner --exit-code "$apk"
      # F-Droid builds the tag unsigned from its own clone, in its own folder.
      - name: Clean build from a clone elsewhere
        if: matrix.build == 'clean'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone -q "$GITHUB_WORKSPACE" "$RUNNER_TEMP/again"
          git -C "$RUNNER_TEMP/again" checkout -q "$(git rev-parse HEAD)"
          sh "$RUNNER_TEMP/again/scripts/android-build.sh"
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$RUNNER_TEMP/again/app/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk" "$RUNNER_TEMP/apk/"
      - if: steps.gradle.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/gradle/caches/modules-2
            /opt/gradle/wrapper/dists
            /github/home/.cache/gradlew-fdroid
          key: ${{ steps.gradle.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ matrix.build }}
          if-no-files-found: error
          path: ${{ runner.temp }}/apk/*.apk

  # F-Droid publishes the release APK only when its own unsigned build matches it except for the
  # signature (packaging/fdroid/, Binaries). So does this.
  android-compare:
    needs: android
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends apksigcopier
      - uses: actions/download-artifact@v4
        with:
          pattern: android-build-*
          path: apk
          merge-multiple: true
      - run: apksigcopier compare apk/app-universal-release.apk --unsigned apk/app-universal-release-unsigned.apk
      - run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name="lull-${GITHUB_REF_NAME#v}-android-arm64.apk"; else name=lull-android-arm64-test.apk; fi
          mkdir out && cp apk/app-universal-release.apk "out/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: lull-android
          if-no-files-found: error
          path: out/lull-*.apk

  # The Linux server package and the hub kits (ADR-0090), both architectures, held to the hub contract.
  server-package:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/server-package.yml
    with:
      ref: ${{ github.ref }}
      release: true
    secrets: inherit

  release:
    needs: [bundle, android-compare, server-package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            fastlane
      - uses: actions/download-artifact@v4
        with:
          pattern: lull-*
          path: bundles
          merge-multiple: true
      # Each artifact keeps the bundler's folders (nsis/, deb/, appimage/...): the Release takes the
      # files alone.
      - run: find bundles -mindepth 2 -type f -exec mv -t bundles {} + && find bundles -mindepth 1 -type d -delete
      # latest.json is what the app's updater reads (tauri.conf.json plugins.updater.endpoints): for
      # each Windows and Linux architecture its installer, and its AppImage, .deb or .rpm (whichever
      # this install came from); for Android, which has no Tauri updater, the APK
      # (app/src/mobile/update.rs). It fails unless every platform is there.
      - name: Updater manifest
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/updater-manifest.mjs manifest "${TAG#v}" "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" bundles
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The Release says what's new as the stores do: the tag's fastlane notes (ADR-0098), else GitHub's list.
        run: |
          code=$(echo "${TAG#v}" | awk -F. '{ print $1 * 1000000 + $2 * 1000 + $3 }')
          notes=fastlane/metadata/android/en-US/changelogs/$code.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || if [ -f "$notes" ]; then
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "lull $TAG" --notes-file "$notes"
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "lull $TAG" --generate-notes
            fi
          gh release upload "$TAG" bundles/* --repo "$GITHUB_REPOSITORY" --clobber

  # lull in the AUR (aur.yml): the PKGBUILD for this release, built and started on Arch, then pushed to the AUR.
  aur:
    needs: release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/aur.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}
      publish: true
    secrets:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
