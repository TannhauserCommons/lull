name: spike

# Throwaway (branch spike-sign-after-build, never merged): can lull's release files be built unsigned and signed afterwards?
# Experiments of the design study of step 2 (E2 and E3 are answered and their jobs removed; their scripts stay). It runs only on a pull request that changes this file or
# scripts/spike/, so on that branch alone. No secret is read: every key is made inside its job and thrown away. Each job
# ends with a RESULT block (RESULT E<n>: PASS or FAIL, then the evidence) and uploads the small artifact spike-<n>.
on:
  pull_request:
    paths: [".github/workflows/spike.yml", "scripts/spike/**"]

permissions:
  contents: read

concurrency:
  group: spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # E1: the unsigned clean APK, built as check.yml's `android (clean)` job builds it, signed afterwards by build-tools
  # 34.0.0's apksigner (pinned with sdkmanager) with a throwaway key and held to F-Droid's check (`apksigcopier compare`);
  # Debian's apksigner recorded as evidence; then, with the same key, the Gradle-signed APK (check.yml's `signed` build)
  # compared with the apksigner-signed one, and with a variant signed with exactly the schemes Gradle's APK has.
  e1-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
    env:
      ANDROID_HOME: /opt/android-sdk
      CARGO_HOME: /opt/cargo
      GRADLE_USER_HOME: /opt/gradle
      RUSTUP_HOME: /opt/rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache: false
          cache_save: false
      - name: mise run android:sdk
        run: mise run android:sdk
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/bin
            /opt/cargo/.crates.toml
            /opt/cargo/.crates2.json
          key: android-cargo-${{ hashFiles('app/Cargo.lock', 'app/package.json', 'rust-toolchain.toml') }}
          restore-keys: android-cargo-
      - name: mise run android:toolchains
        run: mise run android:toolchains
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /opt/gradle/caches/modules-2
            /opt/gradle/wrapper/dists
            /github/home/.cache/gradlew-fdroid
          key: android-gradle-clean-${{ hashFiles('app/gen/android/**/*.gradle.kts', 'app/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-clean-
      - name: mise run android:apk clean
        run: mise run android:apk clean
      - name: Sign afterwards (a, a', b)
        run: sh scripts/spike/e1-android.sh sign
      # Evidence only (c, d): its failure does not decide the verdict.
      - name: Gradle-signed with the same key, and the Gradle schemes (c, d)
        continue-on-error: true
        run: sh scripts/spike/e1-android.sh gradle
      - name: Result
        if: ${{ !cancelled() }}
        run: sh scripts/spike/result.sh e1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: spike-1
          if-no-files-found: error
          retention-days: 3
          path: |
            ${{ runner.temp }}/spike/e1
            !${{ runner.temp }}/spike/e1/*.apk
            !${{ runner.temp }}/spike/e1/*.idsig
            !${{ runner.temp }}/spike/e1/*.jks
