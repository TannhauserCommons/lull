name: release-image
# Self-hosters follow releases (ADR-0098): the hub's image of a version tag, as :X.Y.Z, and :latest when the tag is
# the newest release. It runs on the tag itself, so every way of releasing publishes it: release.yml starts it (a tag
# its job token pushes starts no workflow), and a tag a person pushes (`mise run release`) starts it here. 0.2.8 to
# 0.2.10 were tagged that way while this lived in release.yml, and no image was published. A dispatch from main with
# `tag` publishes a tag that has none. :main and :sha-<short> stay the queue's.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, vX.Y.Z"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-image-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]{1,3}\.[0-9]{1,3}$' || { echo "::error::$TAG isn't a release tag vX.Y.Z"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
      # :latest only for the newest release, so publishing an older tag never moves self-hosters back.
      - id: image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -eu
          git fetch -q --tags origin
          name="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/lull"
          newest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          tags="$name:$VERSION"
          [ "$newest" != "$TAG" ] || tags="$tags,$name:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "$TAG^{commit}")" >> "$GITHUB_OUTPUT"
          echo "Publishes $tags (newest release: $newest)" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.commit }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.title=lull
            org.opencontainers.image.licenses=AGPL-3.0-only
          secrets: |
            lastfm_key=${{ secrets.LULL_LASTFM_API_KEY }}
            lastfm_secret=${{ secrets.LULL_LASTFM_API_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
