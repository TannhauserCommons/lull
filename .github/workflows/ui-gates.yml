name: ui-gates
# The UI gates on the fixture hub (tests/ui/fixture-hub, Node only, no image): performance budgets under a 4x CPU
# slowdown, the key screens against their goldens in every design, theme and size, accessibility, and the chrome
# fitting at every width.
# `mise run check:ui` runs the same; docs/context/quality.md#ui-gates. `capture` (by hand, or while no goldens are
# committed) writes the screens' pictures instead of comparing: `mise run ui:approve` takes them from the run.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tests/ui/**"
      - ".github/workflows/ui-gates.yml"
  pull_request:
    paths:
      - "web/**"
      - "tests/ui/**"
      - ".github/workflows/ui-gates.yml"
  workflow_dispatch:
    inputs:
      capture:
        description: "Write the screens' goldens instead of comparing against them"
        type: boolean
        default: false
  # The queue (ADR-0095) runs these checks on its candidate.
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ui-gates-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !inputs.ref }}

jobs:
  # Four machines at once: performance alone on one (its task lengths must not share the CPU), and every other gate
  # split three ways by Playwright's --shard. GATES (gates/playwright.config.mjs) picks the projects, so a new gate runs
  # here without being listed.
  gates:
    name: gates (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: perf, gates: perf, args: "--workers 1", browsers: chromium }
          - { part: "1 of 3", gates: rest, args: "--shard=1/3", browsers: chromium webkit, slot: 1 }
          - { part: "2 of 3", gates: rest, args: "--shard=2/3", browsers: chromium webkit, slot: 2 }
          - { part: "3 of 3", gates: rest, args: "--shard=3/3", browsers: chromium webkit, slot: 3 }
    env:
      GATES: ${{ matrix.gates }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
          cache: npm
          cache-dependency-path: |
            tests/ui/package-lock.json
            web/package-lock.json
      - name: Webamp and the QR encoder (Classic mode, pairing)
        run: sh scripts/vendor-web.sh
      - working-directory: tests/ui
        run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/ui-browsers
        with:
          browsers: ${{ matrix.browsers }}

      - id: mode
        name: Compare or capture
        run: |
          if [ "${{ inputs.capture }}" = "true" ] || [ -z "$(ls -A tests/ui/gates/goldens/linux 2>/dev/null)" ]; then
            echo "capture=true" >> "$GITHUB_OUTPUT"
            echo "UI_CAPTURE=1" >> "$GITHUB_ENV"
            # Each machine uploads only the pictures it took: the committed ones from the other shards would overwrite
            # fresh ones when ui:approve merges the three.
            rm -rf tests/ui/gates/goldens/linux
          else
            echo "capture=false" >> "$GITHUB_OUTPUT"
          fi

      # Every stepped easing a loop uses is exactly what scripts/loop-easings.mjs makes (docs/themes.md, Drawing cheaply).
      - name: Stepped easings
        if: ${{ matrix.gates == 'perf' }}
        run: node scripts/loop-easings.mjs --check web
      - name: Gates (${{ matrix.part }})
        working-directory: tests/ui
        run: npx playwright test -c gates/playwright.config.mjs ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.mode.outputs.capture == 'true' && matrix.gates == 'rest' }}
        with:
          name: gates-goldens-${{ matrix.slot }}
          path: tests/ui/gates/goldens/linux
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: gates-diffs-${{ matrix.gates }}${{ matrix.slot }}
          # Expected, actual and diff images of every failing picture, the traces' numbers, and the HTML report.
          path: |
            tests/ui/test-results/gates
            tests/ui/report/gates
          if-no-files-found: ignore
