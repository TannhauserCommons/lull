name: youtube-music-contract
# Search reads YouTube Music's own search answer, which YouTube publishes no contract for
# (crates/discovery/src/search/youtube_music.rs). If its shape moves, search quietly loses its
# gap-filler (it answers nothing, by design); this runs the one live check daily and whenever the
# reader changes (the queue starts it after landing a change to it), so the move shows here as a red
# run instead. Not a queue check: YouTube being down must not hold back a landing.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      # Only main saves (ADR-0097).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p lull-discovery --lib --locked -- --ignored youtube_music::tests::the_live_answer_still_reads
