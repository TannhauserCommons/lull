name: check

# Runs in shadow beside the merge queue (docs/context/quality.md, Check in
# shadow): it blocks nothing and changes nothing about how the queue, `ship` or
# a release works. The one status of this workflow is `gate` ("check / gate").
#
# Agents land through `queue/<topic>` branches, not pull requests, so every
# topic an agent ships is checked by the `queue/**` push as well as by any pull
# request. That push trigger goes when the queue does.
on:
  pull_request:
  push:
    branches: ['queue/**']
  workflow_call:
    inputs:
      all:
        description: Run every job, whatever paths changed
        type: boolean
        default: false
    secrets:
      PRIVATE_PATTERNS:
        description: Patterns the privacy check rejects, one extended regex a line
        required: false

permissions:
  contents: read

# A newer push to a ref cancels the older run of that ref. Cancelled is neither
# red nor green.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, so the status never hangs in Pending. Decides which path-gated
  # jobs run and which of them the gate may see skipped. On a push to a
  # `queue/**` branch the path filter compares with main.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.select.outputs.run }}
      skippable: ${{ steps.select.outputs.skippable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - id: filter
        if: ${{ !inputs.all }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci/paths.yml
      - id: select
        name: mise run ci:select
        run: mise run ci:select ${{ inputs.all && '--all' || '' }}
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}

  # Each job is checkout, mise, one `mise run <task>`. A path-gated job has a
  # key in .github/ci/paths.yml and an `if:` on the `changes` output; any other
  # job always runs. Every job id goes in the gate's `needs:`.

  # fmt, clippy, the Rust and web tests, the release scopes and the lint of
  # this workflow: the same list as `mise run check`. The job id and runner
  # match ci.yml's `check`, so rust-cache restores the cache that job saves on
  # main (rust-cache keys on the job id, the OS and the installed toolchains).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The release scopes check reads every commit since the last release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      # rust-cache keys on the installed toolchains, so the pinned one goes in
      # first, as ci.yml does.
      - name: mise run toolchain
        run: mise run toolchain
      # Only main saves (ADR-0097); this workflow reads the cache ci.yml saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: mise run check
        run: mise run check

  # Every commit in UTC, and nothing private in the files or the history.
  privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run privacy
        run: mise run privacy
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}

  # --- The app and contract checks the merge queue runs today (app.yml,
  # server-package.yml, slskd-contract.yml, slskd-windows.yml, share.yml,
  # aur.yml), each a path-gated job: `if:` reads the `changes` output and the
  # job id is a key in .github/ci/paths.yml. Rust caches are restored, never
  # saved (the old workflows save them on main): rust-cache keys on the OS, the
  # installed toolchains and the job id, and these jobs' ids differ from the old
  # ones', so `shared-key` spells out the old job's key (v0-rust-<shared-key>-
  # <OS>-<arch>-...) and the old caches hit. Nothing here uses a secret, and
  # nothing publishes or signs.

  # The app's checks (app/) on Linux x64 and Windows x64 (app.yml `check`).
  # ubuntu-22.04 is the oldest glibc the app supports. windows-2025 is what
  # windows-latest points to today; nothing in the build needs another image.
  app:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'app') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run toolchain
        run: mise run toolchain
      # app.yml's `check` job had no key of its own: job id `check`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          shared-key: check
          save-if: false
      - name: mise run app:check
        run: mise run app:check

  # ADR-0091 on Linux with a Secret Service (app.yml `keyring`). That job's own
  # cache was never saved by anyone; this one restores the app's.
  keyring:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'keyring') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run toolchain
        run: mise run toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app
          shared-key: check
          save-if: false
      - name: mise run app:keyring
        run: mise run app:keyring

  # Android, the APK built the way F-Droid builds it, in F-Droid's build image
  # (app.yml `android`): `signed` with a throwaway key made in the job, and
  # `clean`, unsigned from a clone in another folder. The cache action inside a
  # container resolves `~` to another home than the steps' HOME, so mise's own
  # cache is off here (the tools are fetched each run) and Gradle's home is a
  # fixed path (GRADLE_USER_HOME).
  android:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'android') }}
    strategy:
      fail-fast: false
      matrix:
        build: [signed, clean]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
    env:
      ANDROID_HOME: /opt/android-sdk
      CARGO_HOME: /opt/cargo
      GRADLE_USER_HOME: /opt/gradle
      RUSTUP_HOME: /opt/rustup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache: false
          cache_save: false
      - name: mise run android:sdk
        run: mise run android:sdk
      # The keys app.yml saves on main, restored here and never saved.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /opt/cargo/registry
            /opt/cargo/bin
            /opt/cargo/.crates.toml
            /opt/cargo/.crates2.json
          key: android-cargo-${{ hashFiles('app/Cargo.lock', 'app/package.json', 'rust-toolchain.toml') }}
          restore-keys: android-cargo-
      - name: mise run android:toolchains
        run: mise run android:toolchains
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            /opt/gradle/caches/modules-2
            /opt/gradle/wrapper/dists
            /github/home/.cache/gradlew-fdroid
          key: android-gradle-${{ matrix.build }}-${{ hashFiles('app/gen/android/**/*.gradle.kts', 'app/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ matrix.build }}-
      - name: mise run android:apk
        run: mise run android:apk ${{ matrix.build }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-${{ matrix.build }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/apk/*.apk

  # F-Droid publishes the release APK only when its own unsigned build matches
  # it except for the signature; so does this (app.yml `android-compare`).
  android-compare:
    needs: [changes, android]
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'android-compare') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache: false
          cache_save: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: android-build-*
          path: apk
          merge-multiple: true
      - name: mise run android:compare
        run: mise run android:compare

  # The pinned slskd resumes a download from a pre-sized incomplete file, and
  # overwrites when told to (slskd-contract.yml `resume`): the real image in
  # Docker, against stand-in Soulseek server and peer. Pulls the image.
  slskd:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'slskd') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run slskd:resume
        run: mise run slskd:resume

  # The binary the Windows app bundles, run as the app runs it: Windows
  # enforces how slskd opens the file it downloads (slskd-contract.yml
  # `windows`). Downloads that binary by app/build.rs's pin.
  slskd-windows:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'slskd-windows') }}
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run slskd:native
        run: mise run slskd:native

  # lull's slskd for Windows built twice, to the same bytes and the pinned ones
  # (slskd-windows.yml). Builds from upstream's pinned release: network.
  slskd-build:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'slskd-build') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run slskd:build
        run: mise run slskd:build

  # The Linux server package (server-package.yml `build`), x64 on the oldest
  # glibc, unsigned, then held to the hub contract by the jobs below. The full
  # history, for the version the hub says it is.
  package:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'package') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run toolchain
        run: mise run toolchain
      # server-package.yml's `build`: key server-package-x64, job id build.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server-package-x64-build
          save-if: false
      - name: mise run package:build
        run: mise run package:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lull-server-linux-x64
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/packages/

  # Installed as a service in a fresh Ubuntu, Debian or Fedora running systemd
  # (server-package.yml `contract`).
  package-contract:
    needs: [changes, package]
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'package-contract') }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, fedora]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lull-server-linux-x64
          path: ${{ runner.temp }}/packages
      - name: mise run package:contract
        run: mise run package:contract ${{ matrix.distro }}

  # The listener's existing Jellyfin, a real one (server-package.yml `jellyfin`).
  package-jellyfin:
    needs: [changes, package]
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'package-jellyfin') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lull-server-linux-x64
          path: ${{ runner.temp }}/packages
      - name: mise run package:jellyfin
        run: mise run package:jellyfin

  # A hub updating itself (server-package.yml `self-update`). Two debug builds.
  package-self-update:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'package-self-update') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run toolchain
        run: mise run toolchain
      # server-package.yml's `self-update`: key self-update, job id self-update.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: self-update-self-update
          save-if: false
      - name: mise run package:self-update
        run: mise run package:self-update

  # The listener's logins across an update (server-package.yml `secrets-update`),
  # from the last release before the vault, built from its tag. That job meant
  # to read self-update's cache, but its job id made another key; this one reads it.
  package-secrets-update:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'package-secrets-update') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run toolchain
        run: mise run toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: self-update-self-update
          save-if: false
      - name: mise run package:secrets-update
        run: mise run package:secrets-update

  # The share Worker's tests, in Cloudflare's local runtime (share.yml `test`;
  # `deploy` is not a check).
  share:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'share') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: ${{ github.ref == 'refs/heads/main' }}
      - name: mise run share:test
        run: mise run share:test

  # lull-bin's PKGBUILD built, installed and started on Arch, against the newest
  # release (aur.yml `package`; `publish` is not a check). Arch's own image,
  # dated, which has no git: checkout then downloads the tree, and the script's
  # pacman brings the system current.
  aur:
    needs: changes
    if: ${{ contains(fromJSON(needs.changes.outputs.run), 'aur') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:base-devel-20261018.0.612668
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache: false
          cache_save: false
      - name: mise run aur:package
        run: mise run aur:package
        env:
          GH_TOKEN: ${{ github.token }}

  # The one status. `!cancelled()` makes it run when a job it needs failed (a
  # plain `needs:` job would be skipped, and skipped counts as passing). It
  # fails on any failed or cancelled job, and lets a job be skipped only when
  # the path map left it out.
  gate:
    if: ${{ !cancelled() }}
    needs:
      [
        changes, check, privacy,
        app, keyring, android, android-compare, slskd, slskd-windows, slskd-build,
        package, package-contract, package-jellyfin, package-self-update, package-secrets-update,
        share, aur,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: ${{ needs.changes.outputs.skippable }}
