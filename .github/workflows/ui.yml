name: ui
# The web UI against a hub built from this commit's image: the visual matrix (every route x five
# designs x day/night x phone/desktop) and the Lighthouse budgets. docs/context/quality.md.
# `capture` (by hand, or when no goldens are committed) writes the pictures instead of comparing:
# take them from the run's `goldens` artifact (`mise run ui:update`).
on:
  pull_request:
    paths:
      - "web/**"
      - "crates/server/src/web.rs"
      - "tests/ui/**"
      - "scripts/web-dist/**"
      - "Dockerfile"
      - ".github/workflows/ui.yml"
  workflow_dispatch:
    inputs:
      capture:
        description: "Write the goldens instead of comparing against them"
        type: boolean
        default: false
  # The queue (ADR-0095) runs these checks on its candidate.
  workflow_call:
    inputs:
      ref:
        description: The commit to check
        type: string
        required: true
      image-artifact:
        description: The artifact holding the image to test, built once by the queue (`docker save`)
        type: string
        default: ""

permissions:
  contents: read
  # scripts/flaky.mjs files an issue for each flaky test.
  issues: write

concurrency:
  group: ui-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !inputs.ref }}

env:
  # The hub in the image listens here (tests/ui/run-hub.sh); the stub slskd next to it on :5030.
  LULL_URL: http://127.0.0.1:8080
  LULL_SETUP_CODE: ui-test-setup

jobs:
  # Six machines at once, each with its own hub from the same image: the visual matrix split four ways by
  # Playwright's --shard, and the Lighthouse routes two ways (lighthouse.sh). One machine took 13 minutes.
  ui:
    name: ui (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: "1 of 4", shard: "1/4", slot: 1 }
          - { part: "2 of 4", shard: "2/4", slot: 2 }
          - { part: "3 of 4", shard: "3/4", slot: 3 }
          - { part: "4 of 4", shard: "4/4", slot: 4 }
          - { part: "lighthouse 1 of 2", lighthouse: "1/2", slot: 5 }
          - { part: "lighthouse 2 of 2", lighthouse: "2/2", slot: 6 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11"
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      # The queue's image (the one it will publish), or one built here.
      - if: inputs.image-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}
      - if: inputs.image-artifact != ''
        run: docker load -i "$RUNNER_TEMP/lull-image.tar" && docker tag lull:candidate lull:ui
      - if: inputs.image-artifact == ''
        uses: docker/setup-buildx-action@v3
      - if: inputs.image-artifact == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lull:ui
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - working-directory: tests/ui
        run: npm ci --no-audit --no-fund
      - uses: ./.github/actions/ui-browsers
        with:
          browsers: chromium
          packages: ffmpeg

      - name: Start the hub on a fixture library and a stub slskd
        working-directory: tests/ui
        run: |
          node fixtures/make-library.mjs "$RUNNER_TEMP/music"
          nohup node stub-slskd.mjs 5030 ui-test-key > "$RUNNER_TEMP/slskd-stub.log" 2>&1 &
          sh run-hub.sh lull:ui "$RUNNER_TEMP/music" "$RUNNER_TEMP/hub"

      - id: mode
        name: Compare or capture
        run: |
          if [ "${{ inputs.capture }}" = "true" ] || [ -z "$(ls -A tests/ui/goldens 2>/dev/null)" ]; then
            echo "capture=true" >> "$GITHUB_OUTPUT"
            echo "UI_CAPTURE=1" >> "$GITHUB_ENV"
            # Each machine uploads only the pictures it took: the committed ones from the other shards would overwrite
            # fresh ones when ui:update merges them.
            rm -rf tests/ui/goldens
          else
            echo "capture=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Visual matrix (${{ matrix.part }})
        if: matrix.shard
        working-directory: tests/ui
        run: npx playwright test --shard=${{ matrix.shard }}

      # The image holds the same hub contract as the Linux package (ADR-0090; server-package.yml runs it there). After
      # the pictures: it changes a setting, and the parts restart.
      - name: The image keeps the hub contract
        if: ${{ !cancelled() && matrix.slot == 1 }}
        run: |
          code=$(docker exec lull-ui lull pair | sed -n 's/.*enter the code \([A-Z0-9]*\).*/\1/p')
          node tests/hub-contract/run.mjs "$LULL_URL" --pair "$code" --youtube

      - name: Lighthouse budgets (${{ matrix.part }})
        if: ${{ !cancelled() && matrix.lighthouse }}
        working-directory: tests/ui
        env:
          LH_SHARD: ${{ matrix.lighthouse }}
        # The matrix's global setup pairs the hub and keeps the device cookie Lighthouse loads pages with; on a shard
        # of its own Lighthouse would measure the unpaired hub's setup screen instead.
        run: |
          node -e "import('./global-setup.mjs').then((m) => m.default())"
          export CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          sh lighthouse.sh

      # A test that failed and then passed on its retry (playwright.config.mjs) is flaky: it doesn't hold the
      # landing, and its owner hears of it (scripts/flaky.mjs).
      - name: Flaky tests
        if: ${{ !cancelled() && matrix.shard }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/flaky.mjs tests/ui/report/results.json "ui (${{ matrix.part }})"

      # The stub answers what the hub asks slskd in these tests; a call it doesn't know would answer 404 and show on every
      # page as a Soulseek banner (seen 2026-11-06 as layout shift on every route), so it fails here by name instead.
      - name: Stub slskd answered every call
        if: ${{ !cancelled() }}
        run: |
          if grep 'unhandled' "$RUNNER_TEMP/slskd-stub.log" | sort | uniq -c | grep .; then
            echo "::error::the hub called slskd routes tests/ui/stub-slskd.mjs doesn't answer (above): answer them there"
            exit 1
          fi

      - name: Hub log
        if: ${{ failure() }}
        run: docker logs lull-ui 2>&1 | tail -200; cat "$RUNNER_TEMP/slskd-stub.log"

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.mode.outputs.capture == 'true' && matrix.shard }}
        with:
          name: goldens-${{ matrix.slot }}
          path: tests/ui/goldens
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: diffs-${{ matrix.slot }}
          # Expected, actual and diff images of every failing picture, and the HTML report.
          path: |
            tests/ui/test-results
            tests/ui/report
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && matrix.lighthouse }}
        with:
          name: lighthouse-${{ matrix.slot }}
          path: tests/ui/lhci
          if-no-files-found: ignore
