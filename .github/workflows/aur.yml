name: aur
# lull-bin, lull in the AUR (docs/context/desktop.md, The AUR): the PKGBUILD for a release (scripts/aur-pkgbuild.sh),
# built with makepkg in Arch's own container on Arch's WebKitGTK, checked by namcap, installed with pacman, started under
# Xvfb until its window draws, and run as its own hub with its slskd (packaging/aur/check-installed.sh); the aarch64
# sources are downloaded and checked too (checksums, minisign). On a release it is then pushed to the AUR, which needs the AUR_SSH_KEY secret (from Bitwarden's lull/AUR_SSH_KEY): until
# that exists the push says so and stops there, as share.yml does without Cloudflare's.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to package (1.2.3); empty for the newest
        type: string
        default: ""
      publish:
        description: Push the PKGBUILD to the AUR
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: The commit whose PKGBUILD template and script to use
        type: string
        required: true
      version:
        description: The release to package (v1.2.3 or 1.2.3); empty for the newest
        type: string
        default: ""
      publish:
        type: boolean
        default: false
    secrets:
      AUR_SSH_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: aur-${{ inputs.ref || github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # check.yml's `aur` job: the same tasks (scripts/ci/aur-release.sh, scripts/ci/aur.sh) on the same image. Arch's own
  # image, dated, which has no git: checkout then downloads the tree, and the script's pacman brings the system current.
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base-devel-20261018.0.612668
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache: false
          cache_save: false
      # The release asked for, else the newest one (looked up as check.yml does).
      - name: The release
        id: release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${VERSION#v}
          if [ -n "$VERSION" ]; then echo "version=$VERSION" >> "$GITHUB_OUTPUT"; else mise run aur:release; fi
      # The release's files, kept by its tag between runs: a tag already seen is not downloaded again. Only main saves.
      - id: bundles
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bundles
          key: aur-bundles-${{ steps.release.outputs.version }}
      - name: mise run aur:package
        run: mise run aur:package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
      - if: steps.bundles.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: bundles
          key: ${{ steps.bundles.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aur-lull-bin
          # .SRCINFO is a hidden file, which the upload leaves out unless asked: the AUR refuses a push without it.
          include-hidden-files: true
          if-no-files-found: error
          path: |
            aur/PKGBUILD
            aur/.SRCINFO

  publish:
    needs: package
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aur-lull-bin
          path: aur
      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::notice::Not pushed to the AUR: the AUR_SSH_KEY secret isn't set yet (docs/context/desktop.md, The AUR)."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          # The AUR's host key, checked against the fingerprint aur.archlinux.org publishes.
          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts | grep -q 'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' \
            || { echo "aur.archlinux.org's host key isn't the published one"; exit 1; }
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/lull-bin.git repo
          cp aur/PKGBUILD aur/.SRCINFO repo/
          cd repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "The AUR already has this PKGBUILD"; exit 0; fi
          version=$(sed -n 's/^\tpkgver = //p' .SRCINFO)
          git -c user.name=TannhauserCommons -c user.email=350945459+TannhauserCommons@users.noreply.github.com \
            commit -q -m "lull $version"
          git push origin HEAD:master
