name: queue
# The only thing that moves main (ADR-0095). Sessions push to queue/<topic> (`mise run ship`); queue-kick
# starts this on main, so its checks read and warm main's caches. One run at a time: it rebases every
# waiting branch onto main (scripts/queue.sh plan), runs the checks the candidate's diff needs, and
# fast-forwards main only when they are green. Then it publishes what main's pushes used to start: the
# image it tested, Pages, the share Worker, and the bundles' caches. Red: main stays, and the branch's tip says why.
on:
  workflow_dispatch:
    inputs:
      first:
        description: "A topic to test alone before the rest, when it helps every batch after it (queue/<topic>)"
        type: string
        default: ""
  # A safety net: a kick lost while GitHub was down would otherwise wait for the next push.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

# Never cancelled. Actions keeps one run waiting and drops older waiting ones; nothing is lost, because
# every run takes every branch waiting in queue/.
concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      statuses: write
    outputs:
      candidate: ${{ steps.plan.outputs.candidate }}
      branches: ${{ steps.plan.outputs.branches }}
      ci: ${{ steps.plan.outputs.ci }}
      ui_gates: ${{ steps.plan.outputs.ui_gates }}
      ui: ${{ steps.plan.outputs.ui }}
      app: ${{ steps.plan.outputs.app }}
      android: ${{ steps.plan.outputs.android }}
      graphics: ${{ steps.plan.outputs.graphics }}
      slskd: ${{ steps.plan.outputs.slskd }}
      package: ${{ steps.plan.outputs.package }}
      image: ${{ steps.plan.outputs.image }}
      pages: ${{ steps.plan.outputs.pages }}
      notes: ${{ steps.plan.outputs.notes }}
      youtube_contract: ${{ steps.plan.outputs.youtube_contract }}
      share: ${{ steps.plan.outputs.share }}
      warm: ${{ steps.plan.outputs.warm }}
      build_release: ${{ steps.plan.outputs.build_release }}
      build_changes: ${{ steps.plan.outputs.build_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # lull's history has one author and committer: rebased commits keep their author and get this.
      - run: |
          git config user.name TannhauserCommons
          git config user.email 350945459+TannhauserCommons@users.noreply.github.com
      # From a copy: the plan checks out every branch's tree under it.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first }}
        run: cp scripts/queue.sh "$RUNNER_TEMP/" && sh "$RUNNER_TEMP/queue.sh" plan

  # A called workflow gets at most its caller's permissions, checked before any job is skipped: app's release job
  # (tags only) never runs here, but must be allowed.
  ci:
    needs: plan
    if: needs.plan.outputs.candidate != '' && needs.plan.outputs.ci == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}

  # Every candidate: its files and every commit message, the rebased ones included (privacy.yml, AGENTS.md Boundaries).
  privacy:
    needs: plan
    if: needs.plan.outputs.candidate != ''
    uses: ./.github/workflows/privacy.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}
    secrets:
      PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}

  ui-gates:
    needs: plan
    if: needs.plan.outputs.candidate != '' && needs.plan.outputs.ui_gates == 'true'
    # A called workflow may ask for no more than this grants: its flaky tests file issues (scripts/flaky.mjs).
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/ui-gates.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}

  app:
    needs: plan
    if: needs.plan.outputs.candidate != '' && (needs.plan.outputs.app == 'true' || needs.plan.outputs.android == 'true')
    permissions:
      contents: write
    uses: ./.github/workflows/app.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}
      checks: ${{ needs.plan.outputs.app == 'true' }}
      android: ${{ needs.plan.outputs.android == 'true' }}

  # The Linux app with no graphics card: each mode, what draws it, the lighter look, every design's frame rate.
  graphics:
    needs: plan
    if: needs.plan.outputs.candidate != '' && needs.plan.outputs.graphics == 'true'
    uses: ./.github/workflows/graphics.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}

  slskd-contract:
    needs: plan
    if: needs.plan.outputs.candidate != '' && needs.plan.outputs.slskd == 'true'
    uses: ./.github/workflows/slskd-contract.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}

  # The Linux server package (ADR-0090), installed as a service and held to the hub contract.
  server-package:
    needs: plan
    if: needs.plan.outputs.candidate != '' && needs.plan.outputs.package == 'true'
    uses: ./.github/workflows/server-package.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}
      build-release: ${{ needs.plan.outputs.build_release }}
      build-changes: ${{ needs.plan.outputs.build_changes }}

  share:
    needs: plan
    if: needs.plan.outputs.candidate != '' && needs.plan.outputs.share == 'true'
    uses: ./.github/workflows/share.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}

  # The hub's image, built once: ui tests it and land publishes it, so what ships is what was tested.
  image:
    needs: plan
    if: needs.plan.outputs.candidate != '' && (needs.plan.outputs.image == 'true' || needs.plan.outputs.ui == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.candidate }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: lull:candidate
          # What the hub says it is between releases: "0.2.4 + 12 changes (abc1234)" (lull_core::build).
          build-args: |
            LULL_BUILD_RELEASE=${{ needs.plan.outputs.build_release }}
            LULL_BUILD_CHANGES=${{ needs.plan.outputs.build_changes }}
            LULL_BUILD_COMMIT=${{ needs.plan.outputs.candidate }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.candidate }}
            org.opencontainers.image.title=lull
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=docker,dest=${{ runner.temp }}/lull-image.tar
          secrets: |
            lastfm_key=${{ secrets.LULL_LASTFM_API_KEY }}
            lastfm_secret=${{ secrets.LULL_LASTFM_API_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/lull-image.tar
          retention-days: 1

  ui:
    needs: [plan, image]
    if: needs.plan.outputs.candidate != '' && needs.plan.outputs.ui == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/ui.yml
    with:
      ref: ${{ needs.plan.outputs.candidate }}
      image-artifact: image

  # Beside the checks: the first red one ends the run with its verdict (scripts/queue.sh watch).
  watch:
    needs: plan
    if: needs.plan.outputs.candidate != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          BRANCHES: ${{ needs.plan.outputs.branches }}
        run: cp scripts/queue.sh "$RUNNER_TEMP/" && sh "$RUNNER_TEMP/queue.sh" watch

  land:
    needs: [plan, privacy, ci, ui-gates, app, graphics, slskd-contract, server-package, share, image, ui]
    # Green means every check the diff needed passed; a check it didn't need is skipped.
    if: >-
      !cancelled() && needs.plan.outputs.candidate != ''
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      statuses: write
      packages: write
      actions: write
    outputs:
      chained: ${{ steps.land.outputs.chained }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The tested image goes up under its commit's tag before main moves, so a landed commit always has one;
      # it takes the :main tag (what installs following main pull) only once main is at that commit.
      - if: needs.image.result == 'success' && needs.plan.outputs.image == 'true'
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - if: needs.image.result == 'success' && needs.plan.outputs.image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        name: Push the image it tested under its commit
        if: needs.image.result == 'success' && needs.plan.outputs.image == 'true'
        env:
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          OWNER: ${{ github.repository_owner }}
        run: |
          docker load -i "$RUNNER_TEMP/lull-image.tar"
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/lull"
          docker tag lull:candidate "$image:sha-$(echo "$CANDIDATE" | cut -c1-7)"
          docker push -q "$image:sha-$(echo "$CANDIDATE" | cut -c1-7)"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - id: land
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          BRANCHES: ${{ needs.plan.outputs.branches }}
        run: sh scripts/queue.sh land
      - name: The image is main's
        if: ${{ !cancelled() && steps.land.outputs.landed == 'true' && steps.image.outputs.name != '' }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag lull:candidate "$IMAGE:main"
          docker push -q "$IMAGE:main"
          echo "Pushed $(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:main")" >> "$GITHUB_STEP_SUMMARY"
      # Pushes made with the job's token start no workflows, so the run starts what main's pushes did. Once main has
      # moved, these run even if the land step broke off after the push: the landed commit gets its image all the same.
      - if: ${{ !cancelled() && steps.land.outputs.landed == 'true' && needs.plan.outputs.pages == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/queue.sh dispatch pages.yml
      - if: ${{ !cancelled() && steps.land.outputs.landed == 'true' && needs.plan.outputs.youtube_contract == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/queue.sh dispatch youtube-music-contract.yml
      - if: ${{ !cancelled() && steps.land.outputs.landed == 'true' && needs.plan.outputs.share == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/queue.sh dispatch share.yml
      - if: ${{ !cancelled() && steps.land.outputs.landed == 'true' && needs.plan.outputs.notes == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/queue.sh dispatch release-draft.yml
      - if: ${{ !cancelled() && steps.land.outputs.landed == 'true' && needs.plan.outputs.warm == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/queue.sh dispatch app.yml

  reject:
    needs: [plan, privacy, ci, ui-gates, app, graphics, slskd-contract, share, image, ui]
    if: >-
      !cancelled() && needs.plan.outputs.candidate != ''
      && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.plan.outputs.candidate }}
          BRANCHES: ${{ needs.plan.outputs.branches }}
          # Named whether they failed or were cancelled (a job past its time limit ends cancelled).
          FAILED: >-
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.privacy.result) && 'privacy ' || '' }}
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.ci.result) && 'ci ' || '' }}
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.ui-gates.result) && 'ui-gates ' || '' }}
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.app.result) && 'app ' || '' }}
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.graphics.result) && 'graphics ' || '' }}
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.slskd-contract.result) && 'slskd-contract ' || '' }}
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.share.result) && 'share ' || '' }}
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.image.result) && 'image ' || '' }}
            ${{ contains(fromJSON('["failure", "cancelled"]'), needs.ui.result) && 'ui ' || '' }}
        run: sh scripts/queue.sh reject

  # A run that a job ended (a GitHub API error in plan or land, say) starts no other, and the branches waiting would sit
  # until the next push or the half-hourly schedule. The verdicts chain the queue themselves; this covers a run that
  # never reached one, and a landing whose request for the next run GitHub kept failing. Three failed runs in a row are
  # the queue's own fault, not a blip: the schedule tries again then.
  next:
    needs: [plan, land, reject]
    if: always() && (contains(needs.*.result, 'failure') || needs.land.outputs.chained == 'false')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/queue.sh rescue
