# The path map: one key per path-gated job id in check.yml. A job whose key is
# absent here always runs. PRs and queue branches run a gated job only when its
# paths changed; a call with `all: true` runs them all.
#
# No job is path-gated yet: the UI, app and contract jobs arrive in later
# changes, each with its key here. `{}` keeps the file a valid, empty map: the
# path filter fails on a file that holds only comments.
{}
