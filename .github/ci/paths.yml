# The path map: one key per path-gated job id in check.yml. A job whose key is
# absent here always runs. PRs run a gated job only when its
# paths changed; a call with `all: true` runs them all.
#
# Each key is the paths its check reads, as globs, plus what counts as "everything changed" (`.github/`) and what runs
# the check here (mise.toml and mise.lock: the tasks and the tool versions every job uses; its own scripts). `ui`
# is also what `image` builds for: check.yml's `image` job runs for either key. `ui` tests that image (the visual
# matrix, and the hub contract on every route the hub serves), so it holds every path of `image` too.
image:
  - 'crates/**'
  - 'web/**'
  - 'share/hosts.json'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'Dockerfile'
  - '.dockerignore'
  - 'scripts/vendor-web.sh'
  - 'scripts/web-dist/**'
  - 'scripts/image-save.sh'
  - '.github/**'
  - 'mise.toml'
  - 'mise.lock'
ui:
  - 'crates/**'
  - 'web/**'
  - 'share/hosts.json'
  - 'Cargo.toml'
  - 'Cargo.lock'
  - 'rust-toolchain.toml'
  - 'Dockerfile'
  - '.dockerignore'
  - 'scripts/vendor-web.sh'
  - 'scripts/web-dist/**'
  - 'scripts/image-save.sh'
  - 'tests/ui/**'
  - 'scripts/playwright-flakes.mjs'
  - '.github/**'
  - 'mise.toml'
  - 'mise.lock'
gates:
  - 'web/**'
  - 'tests/ui/**'
  - 'scripts/loop-easings.mjs'
  - 'scripts/vendor-web.sh'
  - 'scripts/playwright-flakes.mjs'
  - '.github/**'
  - 'mise.toml'
  - 'mise.lock'
# What can change the answer of `mise run budgets`: the web files and their build, the check's own files, the fixture hub
# that serves them, the Playwright version its browser is, and web.rs, whose encoding order the sizing copies.
budgets:
  - 'web/**'
  - 'crates/server/src/web.rs'
  - 'scripts/web-dist/**'
  - 'scripts/budgets/**'
  - 'tests/ui/fixture-hub/**'
  - 'tests/ui/package.json'
  - 'tests/ui/package-lock.json'
  - 'tests/ui/setup.sh'
  - 'tests/web/budgets.test.mjs'
  - '.github/**'
  - 'mise.toml'
  - 'mise.lock'

# App and contract jobs. Each list holds the paths its check reads, plus
# `.github/**` (everything runs for a change there), `mise.toml` and `mise.lock`
# (the tasks and tool versions each job runs) and the job's own scripts. A job
# that runs
# only after another (android-compare after android) or beside it (keyring)
# still has its own key, the same list as the job it follows: the gate lets a
# job skip only when it has one.
app: &app
  - ".github/**"
  - "mise.toml"
  - "mise.lock"
  - "app/**"
  - "crates/**"
  - "web/desktop/**"
  - "web/assets/icons/**"
  - "rust-toolchain.toml"
  - "scripts/ci/lib.sh"
  - "scripts/ci/app-check.sh"
  - "scripts/ci/keyring.sh"
keyring: *app

android: &android
  - ".github/**"
  - "mise.toml"
  - "mise.lock"
  - "app/gen/android/**"
  # The app's shared modules (lib.rs and its siblings; desktop/ is cfg(desktop)), Android's own code, and the
  # Android-only player plugin.
  - "app/src/*.rs"
  - "app/src/mobile/**"
  - "app/plugins/**"
  - "app/capabilities/**"
  - "app/build.rs"
  - "app/Cargo.toml"
  - "app/Cargo.lock"
  - "app/package.json"
  - "app/tauri.conf.json"
  - "app/tauri.android.conf.json"
  - "scripts/android-*"
  - "scripts/android-*/**"
  - "rust-toolchain.toml"
  - "scripts/ci/lib.sh"
  - "scripts/ci/android-*.sh"
android-compare: *android

slskd: &slskd
  - ".github/**"
  - "mise.toml"
  - "mise.lock"
  - "deploy/compose.yaml"
  - "app/build.rs"
  - "app/slskd/**"
  - "crates/soulseek/**"
  - "tests/slskd-contract/**"
slskd-windows: *slskd

# lull's slskd for Windows, built twice: only its recipe and its pin change its bytes.
slskd-build:
  - ".github/**"
  - "mise.toml"
  - "mise.lock"
  - "app/build.rs"
  - "app/slskd/**"
  - "scripts/ci/slskd-build.sh"

# The Linux server package: how it is built, the programs app/build.rs pins for
# it, the contract, and the hub code only the package runs.
package: &package
  - ".github/**"
  - "mise.toml"
  - "mise.lock"
  - "packaging/linux/**"
  - "tests/hub-contract/**"
  - "app/build.rs"
  - "app/licenses/**"
  - "crates/server/src/managed/**"
  - "crates/server/src/cli/**"
  - "crates/server/src/admin.rs"
  - "crates/server/src/kit.rs"
  - "crates/server/src/launch.rs"
  - "crates/server/src/updates.rs"
  - "crates/library/src/jellyfin.rs"
  - "crates/library/src/switch.rs"
  - "crates/library/src/connect.rs"
  - "scripts/ci/lib.sh"
  - "scripts/ci/package-*.sh"
package-contract: *package
package-jellyfin: *package
package-self-update: *package
package-secrets-update: *package

# The share Worker: tested whenever it or a file it serves changes.
share:
  - ".github/**"
  - "mise.toml"
  - "mise.lock"
  - "share/**"
  - "site/**"
  - "web/assets/app-icon.svg"
  - "web/assets/fallback-art-512.png"
  - "web/fonts/nunito-latin.woff2"
  - "packaging/android/assetlinks.json"
  - "app/gen/android/app/src/main/AndroidManifest.xml"

# lull-bin, lull in the AUR: how its PKGBUILD is written.
aur:
  - ".github/**"
  - "mise.toml"
  - "mise.lock"
  - "packaging/aur/**"
  - "scripts/aur-pkgbuild.sh"
  - "scripts/ci/aur.sh"
  - "scripts/ci/aur-release.sh"
