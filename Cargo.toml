[workspace]
resolver = "3"
# Every crate is listed up front so parallel work never edits this list (docs/context/workspace.md).
members = [
  "crates/core",
  "crates/server",
  "crates/soulseek",
  "crates/library",
  "crates/discovery",
  "crates/lastfm",
  "crates/lyrics",
  "crates/collection",
  "crates/skins",
]
# The Tauri wrapper is its own workspace: it shares no code with the server.
exclude = ["desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Versions shared by most crates. A dependency only one crate needs goes in that crate's Cargo.toml.
[workspace.dependencies]
lull-core = { path = "crates/core" }
async-trait = "0.1.92"
axum = "0.8.9"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
