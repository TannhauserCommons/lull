[package]
name = "lull-server"
description = "The lull hub: wiring and in-process restarts, pairing, devices and Connect, settings, events and the web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lull"
path = "src/main.rs"

[dependencies]
lull-core.workspace = true
lull-soulseek = { path = "../soulseek" }
lull-library = { path = "../library" }
lull-discovery = { path = "../discovery" }
lull-lastfm = { path = "../lastfm" }
lull-lyrics = { path = "../lyrics" }
lull-collection = { path = "../collection" }
lull-skins = { path = "../skins" }
lull-subsonic = { path = "../subsonic" }
lull-themes = { path = "../themes" }
lull-youtube = { path = "../youtube" }
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# The database copies taken before updates lose their logins once the update proved itself (ADR-0091):
# opened as plain files, not as the hub's database.
rusqlite.workspace = true
# Pair and setup codes, and the API key and web password of a hub's own slskd.
getrandom = "0.4.3"
# A hub on a computer answers `_lull._tcp` on the local network (managed/advert.rs), as the app's always did.
mdns-sd = "=0.21.6"
# A hub kit's manifest is signed with the desktop updater's minisign key (ADR-0090); pure Rust, no dependencies.
minisign-verify = "=0.3.0"
# A kit's programs come gzipped from the release, like the app's updater files.
flate2 = "=1.1.10"
# A kit's files are checked by SHA-256, as everywhere else in lull.
sha2 = "0.11.1"
# The base64 that wraps Tauri's minisign key and signatures.
base64 = "0.23.1"
# The launcher hands SIGTERM on to the kit it runs (Docker signals PID 1 only).
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
# Ctx::shutdown, which ends the SSE streams and the hub's own tasks on a restart.
tokio-util = "0.7.20"
# `oneshot`: requests go to the crates' router of the moment, which a restart swaps.
tower = { version = "0.5.3", features = ["util"] }
# JSON logs with a level filter from LULL_LOG.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# The web UI is compiled into the binary (read from disk in debug builds).
rust-embed = { version = "8.13.0", features = ["mime-guess", "include-exclude"] }
# Compresses JSON and other text answers (compress.rs); the same tower-http library uses.
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip"] }
# SSE: a broadcast receiver as a stream.
tokio-stream = { version = "0.1.19", features = ["sync"] }

[lints]
workspace = true
