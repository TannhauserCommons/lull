[package]
name = "lull-server"
description = "The lull binary: configuration, wiring, health, events, the access token and the web UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lull"
path = "src/main.rs"

[dependencies]
lull-core.workspace = true
lull-soulseek = { path = "../soulseek" }
lull-library = { path = "../library" }
lull-discovery = { path = "../discovery" }
lull-lastfm = { path = "../lastfm" }
lull-lyrics = { path = "../lyrics" }
lull-collection = { path = "../collection" }
lull-skins = { path = "../skins" }
axum.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# JSON logs with a level filter from LULL_LOG.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# The web UI is compiled into the binary (read from disk in debug builds).
rust-embed = { version = "8.13.0", features = ["mime-guess", "include-exclude"] }
# SSE: a broadcast receiver as a stream.
tokio-stream = { version = "0.1.19", features = ["sync"] }

[lints]
workspace = true
