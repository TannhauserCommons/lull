[package]
name = "lull-discovery"
description = "The home feed, new releases, radio and the taste model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lull-core.workspace = true
async-trait.workspace = true
axum.workspace = true
# Query strings for ListenBrainz, MusicBrainz and Last.fm reads.
reqwest = { workspace = true, features = ["query"] }
rusqlite.workspace = true
# Reading the links people paste and writing a lull link's ids (`open.rs`); the build reqwest and
# collection already use.
url = "=2.5.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Scales catalog covers to the sizes the UI asks for (the same build as library's).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[lints]
workspace = true
