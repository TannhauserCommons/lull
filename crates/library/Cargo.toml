[package]
name = "lull-library"
description = "The saved library (a music folder or Jellyfin) and the save pipeline (MusicBrainz, Cover Art Archive, tags, rescan)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lull-core.workspace = true
async-trait.workspace = true
axum.workspace = true
reqwest = { workspace = true, features = ["query"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# `net`: the UDP broadcast that finds Jellyfin servers on the local network.
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
# Reads and writes audio tags (ID3v2, Vorbis comments, MP4, APE) and embedded cover art for saved files.
lofty = "0.25.5"
# Folder mode (ADR-0003): walks LULL_MUSIC_DIR for the index.
walkdir = "2.5.0"
# Folder mode: watches LULL_MUSIC_DIR so added, changed and removed files reach the index.
notify = "8.2.1"
# Folder mode: serves saved files with Range, ETag and Last-Modified (ServeFile).
tower-http = { version = "0.6.11", features = ["fs"] }
# `oneshot` to call ServeFile from the `Library` seam's `stream`.
tower = { version = "0.5.3", features = ["util"] }
# Folder mode: scales embedded and folder covers down to the sizes the UI asks for.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[lints]
workspace = true
