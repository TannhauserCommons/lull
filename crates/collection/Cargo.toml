[package]
name = "lull-collection"
description = "Likes, follows, history, playlists and M3U, stats, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lull-core.workspace = true
async-trait.workspace = true
axum.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Old .m3u files are Windows-1252, not UTF-8. Already in the tree through reqwest.
encoding_rs = "=0.8.44"
# file:// and http:// entries in M3U files are percent-encoded. Already in the tree through reqwest.
percent-encoding = "=2.3.2"
# Matching M3U lines against the library a few at a time, in order. Already in the tree through axum.
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }

[lints]
workspace = true
