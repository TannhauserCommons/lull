[package]
name = "lull-collection"
description = "Likes, follows, history, playlists and M3U, stats, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lull-core.workspace = true
async-trait.workspace = true
axum.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Old .m3u files are Windows-1252, not UTF-8. Already in the tree through reqwest.
encoding_rs = "=0.8.44"
# file:// and http:// entries in M3U files are percent-encoded. Already in the tree through reqwest.
percent-encoding = "=2.3.2"
# Matching M3U lines against the library a few at a time, in order. Already in the tree through axum.
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
# Reading pasted playlist links (Spotify, Deezer, YouTube, SoundCloud). Already in the tree through reqwest.
url = "=2.5.8"
# Playlist covers: uploads and a link's picture checked, cut square and stored as JPEG. The same
# version as library's and discovery's, plus WebP, which browsers save pictures as.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[lints]
workspace = true
