[package]
name = "lull-core"
description = "Shared contracts: config, database, HTTP client, events, service status, ids, models and the seams between crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
axum.workspace = true
# Device tokens: random generation and the hash the hub stores instead of the token.
getrandom = "0.4.3"
# `art`: scales covers and photos down to the served sizes and reads their real size (the same
# build library and discovery use).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.11.1"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# `Ctx::shutdown`: background tasks end when the hub restarts or stops its crates.
tokio-util = "0.7.20"
tracing.workspace = true

[dev-dependencies]
# Paced and windowed requests are tested on paused time, exactly and without waiting.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# `private`: its test sets the umask wide open, to prove the modes come from creation.
nix = { version = "0.31.3", default-features = false, features = ["fs"] }

[lints]
workspace = true
