[package]
name = "lull-soulseek"
description = "Soulseek through slskd: search, ranking, progressive streaming, the stream cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lull-core.workspace = true
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Free space on the transfers disk, so a full disk evicts cache instead of failing a stream.
fs4 = "=1.1.0"
# Stream combinators for the response body that follows a growing file.
futures-util = "=0.3.34"

[dev-dependencies]
# A fake slskd on a local port (recover.rs tests).
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
