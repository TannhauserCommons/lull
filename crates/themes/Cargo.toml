[package]
name = "lull-themes"
description = "Theme packages: the listener's own themes, stored on the hub for every device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lull-core.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# .lulltheme import and export: deflate only
zip = { version = "=9.2.1", default-features = false, features = ["deflate-flate2"] }
# zip's deflate backend: flate2's default pure-Rust one (miniz_oxide), already in the tree
flate2 = "=1.1.10"
# A pack's egg words in any script: Unicode's XID_Continue table tells combining marks from
# punctuation, which std can't. Tiny, no dependencies, already in the tree through proc-macro2
unicode-ident = "=1.0.27"

[dev-dependencies]
# Driving the router in tests (`oneshot`). Already in the tree through axum.
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
