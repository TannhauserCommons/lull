# One entry point for humans, agents and CI. `mise run setup` once per clone.
[tools]
node = "24.11"

[tasks.setup]
description = "Toolchain, Webamp bundle and git hooks"
run = ["rustup toolchain install", "sh scripts/vendor-web.sh"]

[tasks.check]
description = "Exactly what CI runs"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
  "cargo update --manifest-path app/Cargo.toml --workspace --locked",
]

[tasks.test]
description = "Tests only"
run = "cargo test --workspace --locked"

[tasks.dev]
description = "Run lull locally with settings from .env (UI files reload from disk)"
run = "cargo run --bin lull"
env = { LULL_CONFIG = ".env", LULL_DATA_DIR = "data", LULL_LOG = "info,lull=debug" }

[tasks.image]
description = "Build the container image locally"
run = "docker build -t lull:dev ."

[tasks."web:dist"]
description = "Minify web/ and pre-compress it, as the image (and the app build) ships it: web:dist [out dir]"
run = [
  "npm ci --prefix scripts/web-dist --ignore-scripts --no-audit --no-fund",
  "node scripts/web-dist/build.mjs web {{arg(i=0, default='web-dist')}}",
]

[tasks."ui:update"]
description = "Recapture the visual goldens on CI's image and download them into tests/ui/goldens"
run = "sh tests/ui/update-goldens.sh"

[tasks.release]
description = "Set lull's version, commit and tag vX.Y.Z on main; pushing the tag publishes the apps: release X.Y.Z"
run = "sh scripts/release.sh {{arg(i=0)}}"
