# One entry point for humans, agents and CI. `mise run setup` once per clone.
# Tools are pinned exactly and hash-checked in mise.lock; Rust is pinned by rust-toolchain.toml.
# The shared ci:* tasks come from .github/ci/tasks.toml (docs/context/quality.md, Check in shadow).
[tools]
node = "24.11.1"
python = "3.14.10"
actionlint = "1.7.12"

[task_config]
includes = [".github/ci/tasks.toml"]

[tasks.toolchain]
description = "The Rust toolchain rust-toolchain.toml pins"
run = "rustup toolchain install"

[tasks.setup]
description = "Toolchain, Webamp bundle and git hooks"
run = [{ task = "toolchain" }, "sh scripts/vendor-web.sh"]

# The new workflows are the only ones written to the skeleton's rules (SHA pins, a timeout on every job, one
# `mise run` per step); the older ones don't meet them, so `ci:lint` (every workflow) is not run here.
[tasks.check]
description = "Exactly what the `check` workflow runs: fmt, clippy, tests, the release scopes, the lint of the new workflows"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
  "node --test tests/web/*.test.mjs",
  # Draws the release draft: it fails on a feat or fix scope scripts/release-areas.tsv doesn't map, so that fails
  # here and not on main after landing. The draft it prints is not needed (no `> /dev/null`: cmd on Windows has none).
  "node scripts/release-notes.mjs draft",
  "cargo update --manifest-path app/Cargo.toml --workspace --locked",
  "actionlint .github/workflows/check.yml .github/workflows/after.yml",
  "python .github/ci/lint.py .github/workflows/check.yml .github/workflows/after.yml",
]

[tasks.privacy]
description = "Every commit in UTC and nothing private in the files or messages (PRIVATE_PATTERNS in the environment)"
run = "sh scripts/privacy-check.sh"

[tasks.test]
description = "Tests only"
run = ["cargo test --workspace --locked", "node --test tests/web/*.test.mjs"]

[tasks.dev]
description = "Run lull locally with settings from .env (UI files reload from disk)"
run = "cargo run --bin lull"
env = { LULL_CONFIG = ".env", LULL_DATA_DIR = "data", LULL_LOG = "info,lull=debug" }

[tasks.image]
description = "Build the container image locally"
run = "docker build -t lull:dev ."

[tasks."web:dist"]
description = "Minify web/ and pre-compress it, as the image (and the app build) ships it: web:dist [out dir]"
run = [
  "npm ci --prefix scripts/web-dist --ignore-scripts --no-audit --no-fund",
  "node scripts/web-dist/build.mjs web {{arg(i=0, default='web-dist')}}",
]

[tasks."check:ui"]
description = "The UI gates CI runs on web/ changes: performance budgets, key screens, accessibility (Node and Chromium only)"
run = "sh tests/ui/gates/run.sh"

[tasks."themes:check"]
description = "A quick look at screens (or `mini`, the desktop mini player) in every theme (the built-ins and LULL_THEMES_DIR's), desktop and phone, day and night, with the fit and contrast checks, scrollbars as the app shows them, and one contact sheet: themes:check [--only ids | --mine] [--sizes WxH,...] [--mockup file] [--out dir] <route>..."
run = "node tests/ui/themes-check.mjs"

[tasks."ui:approve"]
description = "Approve how the key screens look now: capture the UI gates' goldens on CI into tests/ui/gates/goldens/linux"
run = "sh tests/ui/gates/approve.sh"

[tasks."ui:update"]
description = "Recapture the visual goldens on CI's image and download them into tests/ui/goldens"
run = "sh tests/ui/update-goldens.sh"

# The web UI checks the `check` workflow runs (docs/context/quality.md, Check in shadow). Each is a script a person can
# run too; the image and the hub need Linux and Docker. `check:ui` above takes GATES=perf|fit|rest and SHARD=2/3.
[tasks."image:save"]
description = "Build the hub image as CI does (main's layer cache read, never written) and save it as a tar: image:save [tar]"
run = "sh scripts/image-save.sh"

[tasks."ui:setup"]
description = "Install what the functional UI tests need on CI: npm ci, Chromium with its system libraries, ffmpeg"
env = { PACKAGES = "ffmpeg" }
run = "sh tests/ui/setup.sh chromium"

[tasks."ui:hub"]
description = "Start the hub the functional UI tests run against: the image from image:save on a fixture library, beside a stub slskd"
run = "sh tests/ui/hub.sh up"

[tasks."ui:matrix"]
description = "The functional UI tests (the visual matrix) on that hub; SHARD=2/4 runs one quarter"
run = "sh tests/ui/matrix.sh"

[tasks."ui:contract"]
description = "The hub contract against that hub"
run = "sh tests/ui/hub.sh contract"

[tasks."ui:stub"]
description = "Fail when that hub called a slskd route the stub doesn't answer"
run = "sh tests/ui/hub.sh stub"

[tasks."ui:logs"]
description = "That hub's log and the stub slskd's, for after a failure"
run = "sh tests/ui/hub.sh logs"

[tasks."flakes:ui"]
description = "Write flakes/ from the UI tests' Playwright reports: the tests that failed, then passed on their retry"
run = "node scripts/playwright-flakes.mjs tests/ui/report/results.json tests/ui/report/gates/results.json"

[tasks.icons]
description = "Render every packaged app icon (desktop, web, store, Android) from the masters in design/assets"
run = "sh scripts/icons/build.sh"

[tasks.ship]
description = "Land HEAD on main through the queue and wait for its verdict: ship <topic>"
run = "sh scripts/ship.sh {{arg(i=0)}}"

[tasks."queue:first"]
description = "Test a waiting queue topic alone, ahead of older ones, for a fix every batch needs: queue:first <topic>"
run = "sh scripts/queue-first.sh {{arg(i=0)}}"

[tasks.release]
description = "Tag vX.Y.Z on main's newest green commit with the version and what's new; pushing the tag publishes the apps: release X.Y.Z"
run = "sh scripts/release.sh {{arg(i=0)}}"
