AntiFeatures:
  NonFreeNet:
    en-US: |-
      The app talks only to the listener's own lull hub (free software, self-hosted), but that hub
      streams from the Soulseek network and YouTube and scrobbles to Last.fm, which are not free
      network services. Settings › App › Check for updates asks GitHub for the newest release, only
      when pressed.
