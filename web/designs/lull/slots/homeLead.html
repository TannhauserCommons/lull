<!-- the desk widgets beside the discover window on a wide desk: the "today" sticker and "this week" -->
<div class="lull-desk">
  <section class="lull-desk__win lull-desk__today" aria-label="Today"><div class="lull-win__bar"><span aria-hidden="true">today</span></div><p class="lull-desk__date"><b>{{date}}</b><span>{{month}}<br>{{weekday}}</span></p></section>
  <!-- this week: minutes and plays plus a 24-hour listening sparkline, linking to Stats; shown once Stats has read them -->
  <section class="lull-desk__win lull-desk__week" data-week="{{week}}" aria-label="This week"><div class="lull-win__bar"><span aria-hidden="true">this week</span></div><p class="lull-desk__nums"><b>{{weekTime}}</b><span>{{weekPlays}} plays, {{weekArtists}} artists</span></p><div class="lull-desk__spark" role="img" aria-label="Listening by hour of day, most around {{weekPeak}}:00"><lull-part name="week-clock"></lull-part></div><p class="lull-desk__axis" aria-hidden="true"><span>0:00</span><span>12:00</span><span>23:00</span></p><a class="btn btn--sm lull-desk__more" href="#/stats">See stats</a></section>
</div>
