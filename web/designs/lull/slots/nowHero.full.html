<!-- the disc system: a clear violet player whose tray holds the song as a printed disc. The disc turns with the song
     (theme.css, --song-pos) while the light on it stays put; play is the chrome hub at the disc's centre; the other
     keys are chrome beads in a groove below, a speaker grille between them. Every part is lull's own live part (data-now, data-act, data-bind). -->
<div class="lull-now" role="group" aria-label="Player">
  <div class="lull-dev">
    <div class="lull-dev__cap"><span class="lull-dev__name" aria-hidden="true">disc system</span><span class="lull-dev__led" data-now="state"><lull-part name="state"></lull-part></span></div>
    <div class="lull-dev__screen">
      <div class="lull-tray">
        <span class="lull-disc" data-now="c-art"><lull-part name="cover" size="100%"></lull-part></span>
        <span class="lull-disc__light" aria-hidden="true"></span>
        <span class="lull-hub" data-now="a"><lull-part name="play-button" size="64"></lull-part></span>
      </div>
      <span class="lull-dev__like" data-now="b"><lull-part name="like-button" size="52"></lull-part></span>
      <lull-part name="device" pick='[data-now="osd"]'></lull-part>
    </div>
    <div class="lull-keys">
      <lull-part name="device" pick=".device__pill--shuffle" cls="lull-key lull-key--shuffle"></lull-part>
      <lull-part name="device" pick=".dpad__btn--left" cls="lull-key lull-key--prev"></lull-part>
      <span class="lull-keys__grille" aria-hidden="true"></span>
      <lull-part name="device" pick=".dpad__btn--right" cls="lull-key lull-key--next"></lull-part>
      <lull-part name="device" pick=".device__pill--repeat" cls="lull-key lull-key--repeat"></lull-part>
    </div>
  </div>
  <div class="lull-now__readout">
    <lull-part name="wave" bars="56"></lull-part>
    <div class="wave-times"><b data-bind="pos">0:00</b><span class="wave-times__buf">buffered to <span data-bind="buffered-to">0:00</span></span><span data-bind="dur">0:00</span></div>
    <div class="lull-now__facts" data-now="facts"><lull-part name="facts"></lull-part></div>
  </div>
</div>
