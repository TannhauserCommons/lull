<!-- the star wheel: a printed cream holder card around a turning sky. The song's waveform is printed round the dial, lit as
     it plays; a needle with a star on its tip points at "now", and the stars drift under it as the song goes on (both
     follow the wave's own --pos, so they move only when the song does). The cover sits in the middle, held by the pin.
     Every live hook is lull's own: the wave and the seek seek, data-bind keeps the times and keys current. -->
<div class="sd-wheel now-dev" role="group" aria-label="Now playing">
  <p class="sd-wheel__cap" aria-hidden="true"><span>{{product}}</span> star wheel</p>
  <div class="sd-dial">
    <span class="sd-dial__rim" aria-hidden="true"></span>
    <lull-part name="wave" bars="60"></lull-part>
    <span class="sd-dial__art" data-now="c-art"><lull-part name="cover" size="100%"></lull-part></span>
  </div>
  <div class="sd-wheel__read">
    <p class="sd-wheel__time"><span data-bind="pos">0:00</span><span class="sd-wheel__of" aria-hidden="true">of</span><span data-bind="dur">0:00</span></p>
    <p class="sd-wheel__facts"><span class="sd-wheel__state" data-now="state"><lull-part name="state"></lull-part></span><span class="device__facts" data-now="facts"><lull-part name="facts"></lull-part></span></p>
  </div>
  <lull-part name="seek" cls="sd-scale"></lull-part>
  <div class="sd-wheel__keys" role="group" aria-label="Transport">
    <button class="btn-icon btn-icon--bare" data-act="shuffle" aria-label="Shuffle (S)" data-tip="Shuffle (S)" data-bind="shuffle" aria-pressed="{{shuffle}}"><lull-part name="icon" icon="shuffle"></lull-part></button><button class="btn-icon btn-icon--bare" data-act="prev" aria-label="Previous (P)" data-tip="Previous (P)"><lull-part name="icon" icon="prev"></lull-part></button><span data-now="a"><lull-part name="play-button" size="64"></lull-part></span><button class="btn-icon btn-icon--bare" data-act="next" aria-label="Next (N)" data-tip="Next (N)"><lull-part name="icon" icon="next"></lull-part></button><button class="btn-icon btn-icon--bare" data-act="repeat" aria-label="{{repeatLabel}} (R)" data-tip="{{repeatLabel}} (R)" data-bind="repeat" aria-pressed="{{repeatOn}}"><lull-part name="icon" icon="{{repeatIcon}}"></lull-part></button>
  </div>
  <span class="sd-wheel__like" data-now="b"><lull-part name="like-button" size="40"></lull-part></span>
</div>
