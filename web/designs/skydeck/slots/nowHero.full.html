<!-- the default handheld with a cartridge seated in its top slot. The label repeats the live compact hooks (data-now="c-art" /
     "c-screen"), so now.js swaps its cover and title on every track change. Decorative: the device says it all. -->
<div class="sd-cart" aria-hidden="true">
  <span class="sd-cart__grip"></span>
  <span class="sd-cart__label">
    <span class="sd-cart__art" data-now="c-art"><lull-part name="compact" pick='[data-now="c-art"]' inner></lull-part></span>
    <span class="sd-cart__title" data-now="c-screen"><lull-part name="compact" pick='[data-now="c-screen"]' inner></lull-part></span>
  </span>
</div>
<lull-part name="device"></lull-part>
