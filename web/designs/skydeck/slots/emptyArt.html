<!-- a little handheld whose LCD speaks in the console's voice. Every line is here; theme.css shows the one that fits
     the empty state's title and art (errors get "no signal" and static instead of a cursor). -->
<span class="sd-empty" data-art="{{art}}" data-title="{{title}}">
  <span class="sd-empty__bezel"><span class="sd-empty__lcd"><span><span class="sd-lcd sd-lcd--fail">no signal</span><span class="sd-lcd sd-lcd--drop">no songs on this cart</span><span class="sd-lcd sd-lcd--play">press play</span><span class="sd-lcd sd-lcd--slot">insert cart</span><span class="sd-lcd sd-lcd--moon">all quiet</span><span class="sd-lcd sd-lcd--empty">empty slot</span><i class="sd-empty__cursor"></i></span></span></span>
  <span class="sd-empty__keys"><span class="sd-empty__dpad"></span><span class="sd-empty__ab"><i></i><i></i></span></span>
</span><span class="sparkle"></span>
