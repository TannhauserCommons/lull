<!-- the desktop mini window as a pocket star wheel: the cream holder, pinned; the cover in its round window, ringed by
     the printed scale that turns a round over the song (theme.css, --song-pos); the seek a printed ruler; the keys.
     desktop.js rewrites [data-dk-now] (cover, title, facts) at each song and drives every data-dk key. -->
<div class="dk-mini {{opaqueClass}}" data-dk-player="device">
  <section class="sd-mini" aria-label="{{product}} mini player" data-tauri-drag-region>
    <div class="sd-mini__head" data-tauri-drag-region><span class="sd-mini__cap" aria-hidden="true" data-tauri-drag-region>star wheel</span><button class="dk-mini__win" data-dk="full" aria-label="Open full window" data-tip="Open full window"><lull-part name="icon" icon="expand"></lull-part></button><button class="dk-mini__win" data-dk="mini-close" aria-label="Close mini player" data-tip="Close mini player"><lull-part name="icon" icon="close"></lull-part></button></div>
    <div class="sd-mini__now" data-tauri-drag-region><div data-dk-now aria-live="polite"><div class="dk-mini__now"><lull-part name="cover" size="84"></lull-part><div><div class="device__title">{{title}}</div><div class="device__artist">{{artist}}</div><div class="device__facts"><span class="q-chip q-chip--{{quality}} q-chip--solid">{{format}}</span></div></div></div></div></div>
    <p class="sd-mini__times"><b data-dk-pos>0:00</b><span data-dk-dur>0:00</span></p>
    <lull-part name="wave"></lull-part>
    <div class="sd-mini__keys"><button class="btn-icon btn-icon--bare" data-dk="shuffle" aria-label="Shuffle" data-tip="Shuffle" aria-pressed="false"><lull-part name="icon" icon="shuffle"></lull-part></button><button class="btn-icon btn-icon--bare" data-dk="previous" aria-label="Previous" data-tip="Previous"><lull-part name="icon" icon="prev"></lull-part></button><button class="btn-gloss btn-gloss--52" data-dk="play-pause" aria-label="{{playLabel}}" data-tip="{{playLabel}}"><lull-part name="icon" icon="{{playIcon}}" cls="{{playIconClass}}"></lull-part></button><button class="btn-icon btn-icon--bare" data-dk="next" aria-label="Next" data-tip="Next"><lull-part name="icon" icon="next"></lull-part></button><button class="btn-icon btn-icon--bare" data-dk="repeat" aria-label="Repeat" data-tip="Repeat" aria-pressed="false"><lull-part name="icon" icon="repeat"></lull-part></button></div>
    <div class="sd-mini__foot"><button class="btn-icon btn-icon--bare {{likeClass}}" data-dk="like" aria-pressed="{{liked}}" aria-label="Like" data-tip="Like"><lull-part name="icon" icon="{{likeIcon}}"></lull-part></button><span class="sd-mini__vol"><button class="btn-icon btn-icon--bare" data-dk="vol-down" aria-label="Volume down" data-tip="Volume down"><lull-part name="icon" icon="minus"></lull-part></button><span data-dk-vol>vol</span><button class="btn-icon btn-icon--bare" data-dk="vol-up" aria-label="Volume up" data-tip="Volume up"><lull-part name="icon" icon="plus"></lull-part></button></span></div>
    <div class="dk-mini__note" aria-hidden="true"></div>
  </section>
</div>
