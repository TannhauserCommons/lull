<!-- the star wheel folded small (phone Lyrics, Queue and Details tabs): the cover in its round window, the song, the keys -->
<div class="sd-wheel sd-wheel--compact now-devc" role="group" aria-label="Player">
  <span class="sd-wheel__win" data-now="c-art"><lull-part name="cover" size="56"></lull-part></span>
  <div class="sd-wheel__song" data-now="c-screen"><lull-part name="compact" pick='[data-now="c-screen"]' inner></lull-part></div>
  <div class="sd-wheel__keys"><button class="btn-icon btn-icon--bare" data-act="prev" aria-label="Previous (P)" data-tip="Previous (P)"><lull-part name="icon" icon="prev"></lull-part></button><span data-now="ca"><lull-part name="play-button" size="48"></lull-part></span><button class="btn-icon btn-icon--bare" data-act="next" aria-label="Next (N)" data-tip="Next (N)"><lull-part name="icon" icon="next"></lull-part></button></div>
</div>
