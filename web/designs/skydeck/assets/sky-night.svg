<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 140">
  <!-- skydeck night ornament: crescent moon as light, a dotted constellation, three sparkles -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#c3c2e2" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#c3c2e2" stop-opacity=".14"/>
      <stop offset="1" stop-color="#c3c2e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff9fe" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff9fe" stop-opacity=".2"/>
      <stop offset="1" stop-color="#fff9fe" stop-opacity="0"/>
    </radialGradient>
    <mask id="bite">
      <rect width="310" height="140" fill="#fff"/>
      <circle cx="260" cy="48" r="23" fill="#000"/>
    </mask>
    <path id="spark" d="M0 -1C.14 -.14 .14 -.14 1 0C.14 .14 .14 .14 0 1C-.14 .14 -.14 .14 -1 0C-.14 -.14 -.14 -.14 0 -1Z"/>
  </defs>
  <circle cx="246" cy="60" r="62" fill="url(#halo)"/>
  <circle cx="246" cy="60" r="36" fill="url(#glow)"/>
  <g mask="url(#bite)">
    <circle cx="246" cy="60" r="26" fill="#fff9fe"/>
    <circle cx="236" cy="70" r="2.4" fill="#e4def9"/>
    <circle cx="229" cy="56" r="1.6" fill="#e4def9"/>
  </g>
  <g stroke="#c3c2e2" stroke-width="1" stroke-dasharray="2 3" opacity=".8">
    <line x1="30" y1="34" x2="74" y2="16"/>
    <line x1="74" y1="16" x2="116" y2="38"/>
    <line x1="116" y1="38" x2="152" y2="20"/>
    <line x1="116" y1="38" x2="188" y2="50"/>
  </g>
  <g fill="#fff9fe">
    <circle cx="30" cy="34" r="1.7"/><circle cx="74" cy="16" r="2.4"/><circle cx="116" cy="38" r="1.7"/>
    <circle cx="152" cy="20" r="2.4"/><circle cx="188" cy="50" r="1.7"/>
    <use href="#spark" transform="translate(296 124) scale(10)"/>
    <use href="#spark" transform="translate(196 112) scale(5)" opacity=".8"/>
    <use href="#spark" transform="translate(8 70) scale(4)" opacity=".7"/>
  </g>
</svg>
