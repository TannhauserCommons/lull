<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice">
  <!-- starlight cover c1: crescent over a cloud bank (periwinkle). Filters: w = watercolour wobble, b = soft glow. -->
  <defs>
    <filter id="w" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7690cc"/>
      <stop offset="0.8" stop-color="#bfd1f0"/>
    </linearGradient>
    <mask id="m">
      <circle cx="76" cy="40" r="15" fill="#fff"/>
      <circle cx="84" cy="34" r="13" fill="#000"/>
    </mask>
  </defs>
  <rect width="120" height="120" fill="url(#s)"/>
  <circle cx="76" cy="40" r="22" fill="#fff3dc" opacity=".45" filter="url(#b)"/>
  <circle cx="76" cy="40" r="15" fill="#fff6e3" mask="url(#m)"/>
  <circle cx="16" cy="18" r="1.1" fill="#fff"/>
  <circle cx="34" cy="34" r="0.8" fill="#fff"/>
  <circle cx="50" cy="12" r="1.3" fill="#fff"/>
  <circle cx="104" cy="70" r="0.9" fill="#fff"/>
  <circle cx="12" cy="54" r="0.8" fill="#fff"/>
  <circle cx="98" cy="16" r="1" fill="#fff"/>
  <circle cx="40" cy="60" r="0.7" fill="#fff"/>
  <path transform="translate(28 50) scale(5)" fill="#fffaf6" d="M0-1C.12-.12.12-.12 1 0C.12.12.12.12 0 1C-.12.12-.12.12-1 0C-.12-.12-.12-.12 0-1Z"/>
  <g fill="#f7f9ff" filter="url(#w)">
    <circle cx="8" cy="94" r="16"/>
    <circle cx="32" cy="84" r="18"/>
    <circle cx="56" cy="94" r="14"/>
    <circle cx="80" cy="86" r="19"/>
    <circle cx="106" cy="93" r="16"/>
    <rect y="94" width="120" height="26"/>
  </g>
  <g fill="#d7e0f6" filter="url(#w)">
    <circle cx="18" cy="110" r="13"/>
    <circle cx="48" cy="106" r="15"/>
    <circle cx="86" cy="110" r="14"/>
    <circle cx="112" cy="106" r="12"/>
    <rect y="110" width="120" height="10"/>
  </g>
</svg>
