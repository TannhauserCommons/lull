<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid slice">
  <!-- starlight cover c2: moon path on still water (pink-lavender dusk). Filters: w = watercolour wobble, b = soft glow. -->
  <defs>
    <filter id="w" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="2.4"/>
    </filter>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1c4de"/>
      <stop offset="1" stop-color="#c4c4ef"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e9edc"/>
      <stop offset="1" stop-color="#4f62a8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="72" fill="url(#s)"/>
  <rect y="70" width="120" height="50" fill="url(#a)"/>
  <circle cx="60" cy="40" r="26" fill="#fff1f7" opacity=".55" filter="url(#b)"/>
  <circle cx="60" cy="40" r="12" fill="#fffaf2"/>
  <circle cx="14" cy="14" r="1" fill="#fff"/>
  <circle cx="30" cy="30" r="0.7" fill="#fff"/>
  <circle cx="98" cy="12" r="1.2" fill="#fff"/>
  <circle cx="108" cy="36" r="0.8" fill="#fff"/>
  <circle cx="84" cy="22" r="0.6" fill="#fff"/>
  <circle cx="22" cy="52" r="0.7" fill="#fff"/>
  <path transform="translate(96 26) scale(4.5)" fill="#fffaf6" d="M0-1C.12-.12.12-.12 1 0C.12.12.12.12 0 1C-.12.12-.12.12-1 0C-.12-.12-.12-.12 0-1Z"/>
  <path d="M0 71Q18 64 36 69T74 67T120 70V73H0Z" fill="#a5a8e0"/>
  <g fill="#fff4ee" opacity=".85" filter="url(#w)">
    <rect x="48.0" y="75" width="24" height="1.8" rx=".9"/>
    <rect x="52.0" y="80" width="16" height="1.8" rx=".9"/>
    <rect x="46.0" y="85" width="28" height="1.8" rx=".9"/>
    <rect x="54.0" y="90" width="12" height="1.8" rx=".9"/>
    <rect x="49.0" y="95" width="22" height="1.8" rx=".9"/>
    <rect x="55.5" y="100" width="9" height="1.8" rx=".9"/>
    <rect x="51.0" y="105" width="18" height="1.8" rx=".9"/>
    <rect x="56.0" y="111" width="8" height="1.8" rx=".9"/>
  </g>
</svg>
