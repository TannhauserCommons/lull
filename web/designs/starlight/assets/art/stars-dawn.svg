<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <!-- star field (dawn): only the highest peaks of high-frequency noise survive the alpha ramp, so specks fall at random
       like img 01's (fine 1 px dust, a sprinkle of 2-3 px stars). One 1600 px sheet, never tiled. -->
  <filter id="fine" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="1" seed="2"/>
    <feColorMatrix values="0 0 0 0 .561  0 0 0 0 .616  0 0 0 0 .863  1 0 0 0 0"/>
    <feComponentTransfer><feFuncA type="linear" slope="12" intercept="-8.5"/></feComponentTransfer>
  </filter>
  <filter id="big" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".16" numOctaves="1" seed="5"/>
    <feColorMatrix values="0 0 0 0 .561  0 0 0 0 .616  0 0 0 0 .863  0 1 0 0 0"/>
    <feComponentTransfer><feFuncA type="linear" slope="16" intercept="-12.3"/></feComponentTransfer>
  </filter>
  <rect width="1600" height="1600" filter="url(#fine)"/>
  <rect width="1600" height="1600" filter="url(#big)"/>
</svg>
