<div class="sl-hero sl-hero--compact now-devc" role="group" aria-label="Player">
  <span class="sl-hero__thumb" data-now="c-art"><lull-part name="cover" size="56"></lull-part></span>
  <div class="sl-hero__song" data-now="c-screen"><lull-part name="compact" pick='[data-now="c-screen"]' inner></lull-part></div>
  <div class="sl-hero__keys"><button class="btn-icon btn-icon--bare" data-act="prev" aria-label="Previous (P)" data-tip="Previous (P)"><lull-part name="icon" icon="prev"></lull-part></button><span data-now="ca"><lull-part name="play-button" size="52"></lull-part></span><button class="btn-icon btn-icon--bare" data-act="next" aria-label="Next (N)" data-tip="Next (N)"><lull-part name="icon" icon="next"></lull-part></button></div>
</div>
