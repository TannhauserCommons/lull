<!-- a tiny aero window whose LCD says what is missing ("0 liked songs" from "No liked songs yet"), "no signal" for errors,
     else a word for the art; theme.css shows the line that fits -->
<span class="gh-empty" data-title="{{title}}" data-art="{{art}}" data-noun="{{noun}}"><span class="gh-empty__bar"></span><span class="gh-empty__lcd"><span class="gh-empty__txt"><span class="gh-lcd gh-lcd--err">no signal</span><span class="gh-lcd gh-lcd--count">0 {{noun}}</span><span class="gh-lcd gh-lcd--moon">all quiet</span><span class="gh-lcd gh-lcd--slot">empty slot</span><span class="gh-lcd gh-lcd--star">nothing yet</span><span class="gh-lcd gh-lcd--wave">silence</span></span><i class="gh-caret"></i></span></span>
