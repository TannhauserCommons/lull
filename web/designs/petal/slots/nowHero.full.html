  <div class="pt-win__tabs">
    <button class="pt-win__pages" data-act="now-page" aria-label="Change screen page (now, source, save)" data-tip="Next screen page"><span class="pt-win__page" data-p="now">now</span><span class="pt-win__page" data-p="source">source</span><span class="pt-win__page" data-p="save">save</span></button>
    <span class="pt-win__head" data-now="head" aria-hidden="true"><lull-part name="state"></lull-part></span>
  </div>
  <div class="device__screen s-screen pt-win__screen">
    <div class="now-dev__host" data-now="screen"><lull-part name="screen"></lull-part></div>
    <div class="now-osd" data-now="osd" aria-hidden="true"></div>
  </div>
  <div class="pt-win__lcd" aria-hidden="true"><span class="pt-win__lcdtext">.:: <b data-bind="pos">0:00</b>/<span data-bind="dur">0:00</span> :: <span data-now="led"><lull-part name="device" pick='[data-now="led"]' inner></lull-part></span> :: rx <span data-bind="received">0%</span> ::.</span><span class="pt-win__kbd"><kbd class="kbd">P</kbd><kbd class="kbd">N</kbd><kbd class="kbd">Space</kbd></span></div>
  <div class="pt-win__deck" role="group" aria-label="Transport">
    <span class="pt-win__like" data-now="cb"><lull-part name="like-button" size="40"></lull-part></span>
    <span class="pt-win__keys">
      <button class="btn-icon btn-icon--bare pt-win__key" data-act="shuffle" aria-label="Shuffle (S)" data-tip="Shuffle" data-bind="shuffle" aria-pressed="{{shuffle}}"><lull-part name="icon" icon="shuffle"></lull-part></button>
      <button class="btn-icon btn-icon--bare pt-win__key" data-act="prev" aria-label="Previous (P)" data-tip="Previous"><lull-part name="icon" icon="prev"></lull-part></button>
      <span class="pt-win__play" data-now="a"><lull-part name="play-button" size="64"></lull-part></span>
      <button class="btn-icon btn-icon--bare pt-win__key" data-act="next" aria-label="Next (N)" data-tip="Next"><lull-part name="icon" icon="next"></lull-part></button>
      <button class="btn-icon btn-icon--bare pt-win__key" data-act="repeat" aria-label="{{repeatLabel}} (R)" data-tip="{{repeatLabel}}" data-bind="repeat" aria-pressed="{{repeatOn}}"><lull-part name="icon" icon="{{repeatIcon}}"></lull-part></button>
    </span>
    <span class="pt-win__vol" role="group" aria-label="Volume"><button class="btn-icon btn-icon--bare pt-win__key" data-act="now-vol" aria-label="Volume down (Down arrow)" data-tip="Volume down" data-dir="-1"><lull-part name="icon" icon="minus"></lull-part></button><button class="btn-icon btn-icon--bare pt-win__key" data-act="now-vol" aria-label="Volume up (Up arrow)" data-tip="Volume up" data-dir="1"><lull-part name="icon" icon="plus"></lull-part></button></span>
  </div>
</div>
