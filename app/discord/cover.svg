<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- lull's Discord picture for a song without a public cover: an aero sky over glossy green hills, bubbles, and lull's
       glass orb (badge.svg) floating in the middle. render.py makes cover.png. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1279d6"/>
      <stop offset=".45" stop-color="#4fb8f5"/>
      <stop offset=".72" stop-color="#bdeaff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <radialGradient id="sun" cx="22%" cy="16%" r="46%">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6ef7d"/>
      <stop offset="1" stop-color="#4cae3c"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93e35a"/>
      <stop offset=".5" stop-color="#46b23a"/>
      <stop offset="1" stop-color="#1f7f2e"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bubble" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#fff" stop-opacity=".04"/>
      <stop offset=".9" stop-color="#e8fdff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".95"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0b4d1f" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0b4d1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset=".6" stop-color="#bff6ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#bff6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <g id="b">
      <circle r="1" fill="url(#bubble)"/>
      <ellipse cx="-.36" cy="-.4" rx=".3" ry=".17" fill="#fff" fill-opacity=".9" transform="rotate(-35 -.36 -.4)"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#sun)"/>
  <g fill="#fff" filter="url(#soft)">
    <ellipse cx="760" cy="210" rx="190" ry="46" fill-opacity=".8"/>
    <ellipse cx="860" cy="250" rx="120" ry="34" fill-opacity=".7"/>
    <ellipse cx="190" cy="430" rx="170" ry="38" fill-opacity=".6"/>
  </g>
  <path d="M0 760C180 670 360 650 560 700S900 770 1024 690V1024H0Z" fill="url(#hillBack)"/>
  <path d="M0 830C220 760 420 770 600 820S880 880 1024 820V1024H0Z" fill="url(#hillFront)"/>
  <path d="M0 830C220 760 420 770 600 820S880 880 1024 820V860C880 916 760 880 600 856S220 800 0 868Z" fill="url(#gloss)"/>
  <ellipse cx="512" cy="840" rx="250" ry="40" fill="url(#shadow)"/>
  <g>
    <use href="#b" transform="translate(150 250) scale(46)"/>
    <use href="#b" transform="translate(220 600) scale(30)"/>
    <use href="#b" transform="translate(110 520) scale(18)"/>
    <use href="#b" transform="translate(860 470) scale(56)"/>
    <use href="#b" transform="translate(780 640) scale(26)"/>
    <use href="#b" transform="translate(910 360) scale(16)"/>
    <use href="#b" transform="translate(330 140) scale(14)"/>
    <use href="#b" transform="translate(690 120) scale(22)"/>
  </g>
  <circle cx="512" cy="470" r="300" fill="url(#halo)"/>
  <image href="badge.svg" xlink:href="badge.svg" x="272" y="230" width="480" height="480"/>
</svg>