"$schema" = "schemas/schema.json"

[default]
description = "Everything the web UI's native player and downloads use (docs/context/web.md, output interface), and the phone's quiet for its sounds (ADR-0081)."
permissions = [
  "allow-load",
  "allow-play",
  "allow-pause",
  "allow-seek",
  "allow-set-volume",
  "allow-set-next",
  "allow-crossfade",
  "allow-equalize",
  "allow-download-add",
  "allow-download-remove",
  "allow-download-list",
  "allow-download-usage",
  "allow-sound-quiet",
  "allow-registerListener",
  "allow-remove-listener",
]
