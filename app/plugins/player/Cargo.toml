[package]
name = "tauri-plugin-lull-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "lull's native Android player: Media3 ExoPlayer in a MediaSession service, and downloads to app storage"
publish = false
links = "tauri-plugin-lull-player"

[build-dependencies]
# Generates the command permissions and builds the Kotlin library (android/).
tauri-plugin = { version = "=2.7.2", features = ["build"] }

[dependencies]
tauri = { version = "=2.12.5", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
