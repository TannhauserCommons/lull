[package]
name = "lull-app"
version = "0.2.5"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/TannhauserCommons/lull"
description = "The lull app for Windows, Linux and Android: the web UI, the hub in-process on desktop, a native player on Android"
publish = false

# Its own workspace: the root workspace excludes app/, so Tauri's tree never slows the server build.
[workspace]

# Tauri's mobile entry point needs the app as a library (staticlib/cdylib for Android, rlib for main.rs).
[lib]
name = "lull_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lull"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
# build.rs fetches the slskd sidecar (pinned by sha256) and unpacks it from its release zip.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
sha2 = "=0.11.1"
zip = { version = "=9.2.1", default-features = false, features = ["deflate"] }

[dependencies]
# The webview shell itself; tray-icon + image-png for the tray glyphs.
tauri = { version = "=2.12.5", features = ["protocol-asset", "tray-icon", "image-png"] }
# Settings file and IPC payloads.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Blocking HTTP to the hub from Rust: health probes, pairing, events. Rust has no mixed-content or
# CORS rules, so a phone can use a hub at http://192.168.x.x. Platform verifier: trust exactly what
# the webview trusts (home CAs included).
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "platform-verifier", "json"] }
# Hub discovery on the local network (_lull._tcp), and advertising the desktop's own hub.
mdns-sd = "=0.21.6"
# Android compares its version with the newest release's (updates.rs). Already in Tauri's tree.
semver = "=1.0.28"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# The hub itself, run in-process when this computer is the hub (ADR-0006).
lull-server = { path = "../crates/server" }
lull-core = { path = "../crates/core" }
# The hub's runtime pieces: its shutdown signal, and its logs in a file next to the app's data.
tokio = { version = "=1.54.1", features = ["sync"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
# Logs of the in-process hub and its sidecar, written to a file (the hub logs through tracing).
tracing = "=0.1.44"
# Official plugins named in DESKTOP.md: window placement, one instance, launch at login.
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
# Auto-update from GitHub Releases, signature-checked (ADR-0006).
tauri-plugin-updater = "=2.14.1"
# The OS config folder, found before Tauri starts as Tauri finds it: the graphics choice is set up
# before the first thread (src/desktop/graphics.rs). Tauri's own version.
dirs = "=7.0.0"

[target.'cfg(windows)'.dependencies]
# Taskbar theme for the tray glyph (registry), a job object so slskd dies with the app, keeping the
# computer awake while it serves (power, awake.rs), a
# minidump of lull's own process if it crashes (dbghelp's MiniDumpWriteDump), and hearing this
# computer's addresses change, to try an unreachable hub again at once (NotifyAddrChange).
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Kernel",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Threading",
] }
# COM for the taskbar's thumbnail buttons (ITaskbarList3), the window subclass that hears their
# clicks, opening links in the browser, and a see-through `main` (its DWM frame); Classic's
# native window (GDI, window regions, menus), its playlist's text (DirectWrite through Direct2D,
# as the browser draws Webamp's: fractional letter spacing, an ellipsis, fallback fonts for other
# scripts) and its media overlay (the System Media Transport Controls). Same version as Tauri's,
# which already enables most of it.
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Media",
  "Storage_Streams",
] }
# Direct2D's point type (where the playlist's text is drawn). The version `windows` itself uses.
windows-numerics = "=0.3.1"
# A see-through `main` (glass.rs): the system's Mica, Acrylic and blur. Tauri's own set_effects
# drops the system's answer, and the page must know what it got. Same version as Tauri's.
window-vibrancy = "=0.8.1"
# Which of those this Windows draws without lag (its build). Same version as window-vibrancy's.
windows-version = "=0.1.7"
# The webview behind a window: a hidden `main` tells WebView2 it isn't visible and needs little
# memory while Classic mode plays. Same version as Tauri's.
webview2-com = "=0.39.1"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# Classic mode without a webview (src/desktop/classic_native): Symphonia decodes the songs (MPL-2.0;
# the royalty-free formats plus MP3 and AAC/ALAC in MP4 and WebM, what the hub serves), cpal plays them
# (Apache-2.0; WASAPI on Windows, ALSA on Linux), image reads the skins' BMP and PNG sheets and zip
# opens the .wsz (both already in the tree: Tauri's image, build.rs's zip). On Linux the window is
# GTK's, drawn with Cairo and Pango, all from the gtk crate below.
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
# Opus, YouTube's format (WebM), which Symphonia can't decode: libopus itself (BSD-3-Clause, built
# from its bundled source with CMake; notice in licenses/THIRD-PARTY.md) through the `opus` wrapper
# (MIT or Apache-2.0). A pure-Rust decoder measured 20 % of a core playing; libopus 0.4 %.
opus = "=0.4.0"
# A skin kept on the device comes from the page as base64. Already in Tauri's tree.
base64 = "=0.23.1"
# Every song resampled to the output's rate, so songs follow each other without a gap and crossfade
# whatever their rates, as the browser's player does: rubato's FFT resampler (MIT or Apache-2.0),
# clean and cheap; audioadapter-buffers is the buffer type it takes (same authors, same licence).
rubato = "=5.0.1"
audioadapter-buffers = "=5.2.0"
cpal = "=0.18.2"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "png"] }
zip = { version = "=9.2.1", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifier host check, GNOME button-layout, compositing check, native Classic's window. Same
# version as Tauri's.
gtk = "=0.18.2"
# Media-key fallback when WebKitGTK ships without Media Session (DESKTOP.md 5).
tauri-plugin-global-shortcut = "=2.4.1"
# Native Classic's media keys and panel (MPRIS on the session bus). Already in the tree through
# tauri-plugin-single-instance, same version and features.
zbus = "=5.19.0"
# prctl(PR_SET_PDEATHSIG): slskd stops when the app does, even after a crash. Already in Tauri's tree.
libc = "=0.2.191"
# The page's process dying (web-process-terminated), so the window recovers (recovery.rs), and
# reading WebKitGTK's own graphics report (webkit://gpu). Wry's own WebKitGTK binding, same version.
webkit2gtk = "=2.0.2"
# The value that report's script answers with. webkit2gtk's own, same version.
javascriptcore-rs = "=1.1.2"

[target.'cfg(target_os = "android")'.dependencies]
# The native player: Media3 with a MediaSession service, downloads to app storage (ADR-0006), and
# the pairing QR scanner (ZXing, not tauri-plugin-barcode-scanner: that one needs Google Play
# Services, which F-Droid can't ship).
tauri-plugin-lull-player = { path = "plugins/player" }
# Opens a newer release's APK in the browser, which downloads it for Android to install.
tauri-plugin-opener = "=2.7.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
# Denied, not forbidden: the Windows taskbar watch and slskd's job object call the Win32 API.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
